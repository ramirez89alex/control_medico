services:
  - type: web
    name: powerdent-api
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production (necesario en runtime, más abajo) hace que "npm
    # install" omita las devDependencies por defecto — pero TypeScript, @types/* y prisma
    # están ahí, y el build los necesita.
    buildCommand: npm install --include=dev && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: node apps/api/dist/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
