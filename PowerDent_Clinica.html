<!DOCTYPE html>
<html lang="es" id="html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#242A4D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PowerDent">
<title>Power Dent · Gestión clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --porcelana:#F4F5F8;
  --hueso:#FFFFFF;
  --grafito:#242A4D;
  --grafito-2:#3B4076;
  --tenue:#7C8199;
  --linea:#DDE0E8;
  --marca:#C9433F;
  --marca-osc:#A5342F;
  --ambar:#E5A00D;
  --rojo:#B3261E;
  --verde:#2E9E5B;
  --r:10px;
  --sombra:0 1px 2px rgba(36,42,77,.06),0 8px 24px rgba(36,42,77,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  background:var(--porcelana);color:var(--grafito);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
aside{
  width:212px;flex:0 0 212px;background:linear-gradient(170deg,#242A4D,#1B2040);color:#D7DAE8;
  padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px}
.brand .mark{width:32px;height:34px;object-fit:contain;flex:0 0 32px}
.brand b{font-family:'Space Grotesk';font-size:16px;color:#fff;letter-spacing:-.03em;display:block}
.brand small{font-size:10.5px;color:#C9433F;letter-spacing:.09em;text-transform:uppercase}
nav button{
  width:100%;text-align:left;background:none;border:0;color:#AEB4CE;padding:9px 10px;border-radius:8px;
  font:inherit;font-size:14px;cursor:pointer;display:flex;gap:9px;align-items:center;margin-bottom:1px
}
nav button:hover{background:#333A66;color:#fff}
nav button.on{background:var(--marca);color:#fff;font-weight:600}
nav .sep{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6E75A0;padding:14px 10px 5px}
main{flex:1;min-width:0;padding:22px 26px var(--hpie,120px)}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{font-size:26px}
.topbar p{margin:2px 0 0;color:var(--tenue);font-size:13px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- componentes ---------- */
.card{background:var(--hueso);border:1px solid var(--linea);border-radius:var(--r);padding:16px;box-shadow:var(--sombra)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tenue);margin:0 0 4px;font-weight:600}
input,select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;font:inherit;font-size:14px;
  background:#fff;color:var(--grafito)
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--marca);outline-offset:1px;border-color:transparent}
textarea{min-height:80px;resize:vertical}
.f{margin-bottom:11px}
button.btn{
  font:inherit;font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:8px;border:1px solid var(--grafito);
  background:var(--grafito);color:#fff;cursor:pointer
}
button.btn:hover{background:var(--grafito-2)}
.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff}
.btn.pri:hover{background:var(--marca-osc)}
.btn.gh{background:transparent;color:var(--grafito);border-color:var(--linea)}
.btn.gh:hover{background:#ECEEF4}
.btn.dan{background:transparent;color:var(--rojo);border-color:#EEC9C5}
.btn.sm{padding:5px 9px;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tenue);padding:6px 8px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #EEF0F5;vertical-align:middle}
tr.click:hover td{background:#FAF4F4;cursor:pointer}
.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#ECEEF4;color:var(--grafito-2);white-space:nowrap}
.tag.ok{background:#DFF3E7;color:#1C6B3D}.tag.warn{background:#FBEFD3;color:#8A6206}.tag.bad{background:#F7DEDC;color:#8E1F18}.tag.info{background:#E1E3F1;color:#3B4076}
.kpi{background:var(--hueso);border:1px solid var(--linea);border-radius:var(--r);padding:13px 15px}
.kpi b{display:block;font-family:'Space Grotesk';font-size:25px;letter-spacing:-.03em;margin-top:2px}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tenue);font-weight:600}
.vacio{padding:26px;text-align:center;color:var(--tenue);font-size:13.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--linea);margin-bottom:16px;overflow:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font:inherit;font-size:13.5px;color:var(--tenue);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--grafito);border-bottom-color:var(--marca);font-weight:600}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entre{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--linea);margin:14px 0}
.mini{font-size:12px;color:var(--tenue)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,32,31,.5);display:grid;place-items:center;padding:16px;z-index:80}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

/* firma */
.firma-box{border:1px dashed var(--tenue);border-radius:8px;background:#fff;touch-action:none}
.legal{background:#F7F9F8;border:1px solid var(--linea);border-radius:8px;padding:13px;font-size:12.5px;line-height:1.5;max-height:230px;overflow:auto;color:var(--grafito-2)}
.legal h4{font-size:12.5px;margin:10px 0 3px}

/* odontograma */
.odo{display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px 0}
.arcada{display:flex;gap:3px;flex-wrap:nowrap;overflow:auto;padding-bottom:4px}
.diente{width:30px;flex:0 0 30px;border:1px solid var(--linea);border-radius:6px;background:#fff;cursor:pointer;padding:3px 0;text-align:center}
.diente small{display:block;font-size:9px;color:var(--tenue);font-family:'IBM Plex Mono',monospace}
.diente i{display:block;width:14px;height:14px;margin:2px auto 0;border-radius:3px;background:#EDEFF5}
.diente.caries i{background:var(--rojo)}.diente.obturado i{background:#3B4076}
.diente.corona i{background:var(--ambar)}.diente.ausente i{background:var(--grafito)}
.diente.implante i{background:#8B5CF6}.diente.endo i{background:#EC6F2B}
.leyenda{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--tenue);margin-top:6px}
.leyenda span{display:flex;align-items:center;gap:4px}
.leyenda em{width:10px;height:10px;border-radius:3px;display:block;font-style:normal}

/* grabadora */
.rec{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#1B2040;color:#fff;border-radius:var(--r);padding:14px}
.rec .dot{width:11px;height:11px;border-radius:99px;background:#4A5C5A}
.rec.on .dot{background:var(--rojo);animation:lat 1s infinite}
@keyframes lat{50%{opacity:.25}}
.rec .t{font-family:'IBM Plex Mono',monospace;font-size:20px}
audio{width:100%;margin-top:6px}

/* planning */
.planning-wrap{overflow:auto}
.solo-lista{display:none}
@media(max-width:980px){.planning-wrap{display:none}.solo-lista{display:block}}
.planning{display:grid;min-width:640px;position:relative}
.ph{background:#F7F9F8;border-bottom:1px solid var(--linea);padding:4px 8px;position:sticky;top:0;z-index:3}
.ph b{font-family:'Space Grotesk';font-size:13px;display:block;line-height:1.2}
.ph span{font-size:10px;color:var(--tenue);text-transform:uppercase;letter-spacing:.06em}
.ph.esq{background:#fff}
.planning .hora{grid-column:1;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--tenue);border-top:1px solid #EEF2F1;padding:2px 6px 0}
.planning .col{border-left:1px solid var(--linea);background:repeating-linear-gradient(to bottom,#fff 0 33px,#F4F7F6 33px 34px)}
.cita{
  position:relative;z-index:2;margin:1px 3px;border-radius:7px;padding:5px 7px;cursor:pointer;overflow:hidden;
  background:color-mix(in srgb,var(--c) 13%,#fff);border-left:3px solid var(--c);
  display:flex;flex-direction:column;gap:1px;line-height:1.25
}
.cita:hover{background:color-mix(in srgb,var(--c) 22%,#fff)}
.cita b{font-size:12.5px;font-family:'Space Grotesk'}
.cita .mini{font-size:10.5px}
.cita .x{position:absolute;top:2px;right:2px;border:0;background:none;cursor:pointer;color:var(--tenue);font-size:14px;line-height:1}
.proxima{margin-top:8px;background:#FBF1F0;border:1px solid #EBC7C4;border-radius:9px;padding:8px 11px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:640px}

.fin{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#FBF1F0;border:1px solid #EBC7C4;border-radius:10px;padding:11px 14px;margin-top:12px}
.fin small{font-size:9.5px;letter-spacing:.1em;color:var(--tenue);font-weight:700}
.fin b{display:block;font-family:'Space Grotesk';font-size:19px;letter-spacing:-.02em}
.finbox{border:1px solid #999;border-radius:6px;padding:10px 12px;margin-top:14px}
/* panel en directo */
.semaforo{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(150deg,#242A4D,#171B38);color:#fff;border-radius:16px;padding:22px 24px}
.semaforo.cerrado{background:linear-gradient(150deg,#3A1614,#241017)}
.semaforo .luz{width:46px;height:46px;border-radius:99px;background:#454B77;flex:0 0 46px}
.semaforo.abierto .luz{background:#3FD98C;box-shadow:0 0 0 0 rgba(63,217,140,.55);animation:pulso 2.4s infinite}
.semaforo.cerrado .luz{background:#C9433F;box-shadow:0 0 24px rgba(201,67,63,.55)}
.semaforo small{font-size:10.5px;letter-spacing:.16em;opacity:.65;font-weight:600}
.semaforo h2{font-family:'Space Grotesk';font-size:30px;letter-spacing:.02em;margin:2px 0}
.semaforo p{margin:0;font-size:13.5px;opacity:.85}
.semaforo .reloj{margin-left:auto;text-align:right}
.semaforo .reloj b{font-family:'IBM Plex Mono';font-size:36px;display:block;line-height:1}
.semaforo .reloj span{font-size:11.5px;opacity:.7;text-transform:capitalize}
.semaforo .ctres{display:flex;gap:18px;border-left:1px solid rgba(255,255,255,.18);padding-left:20px}
.semaforo .ctres b{font-family:'Space Grotesk';font-size:22px;display:block}
.semaforo .ctres span{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.07em}
.gcard{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:15px;border-top:3px solid var(--c);box-shadow:var(--sombra)}
.gcard.ocupado{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 8%,#fff),#fff)}
.gcard .gpac{font-family:'Space Grotesk';font-size:19px;margin:8px 0 2px;letter-spacing:-.02em}
.gcard .barra{height:5px;border-radius:99px;background:#EDF1F0;margin:9px 0 5px;overflow:hidden}
.gcard .barra i{display:block;height:100%;background:var(--c)}
.gnota{border-left:2px solid var(--c);padding-left:8px}
input.ro{background:#F5F7F6;color:var(--grafito-2);border-style:dashed;cursor:not-allowed}
.fases{display:flex;gap:4px}
.fases span{width:13px;height:13px;border-radius:99px;border:1.5px solid var(--linea);background:#fff;cursor:pointer;display:block}
.fases span.ok{background:var(--marca);border-color:var(--marca)}
.fases span:hover{border-color:var(--grafito)}
.sillon{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.spac{background:linear-gradient(150deg,#242A4D,#171B38);color:#fff;border-radius:14px;padding:20px}
.spac h2{font-family:'Space Grotesk';font-size:27px;letter-spacing:-.02em;margin:0}
.spac p{margin:4px 0 10px;opacity:.85;font-size:14px}
.spac .tag{margin-right:6px}
.srev{margin-top:14px;background:rgba(255,255,255,.09);border-left:3px solid var(--marca);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14.5px}
.srev small{display:block;font-size:9.5px;letter-spacing:.14em;opacity:.65;font-weight:700;margin-bottom:3px}
.svoz{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px;box-shadow:var(--sombra)}
.proxcita b{font-family:'Space Grotesk';font-size:18px;text-transform:capitalize}
@media(max-width:980px){.sillon{grid-template-columns:1fr}.spac h2{font-size:23px}}
.transcaja{border:1px solid var(--linea);border-radius:10px;padding:2px;transition:.2s}
.transcaja.grabando{border-color:var(--marca);box-shadow:0 0 0 3px rgba(201,67,63,.14)}
.transcaja textarea{border:0;min-height:132px;font-size:15px;line-height:1.5;resize:vertical}
.transcaja textarea:focus{outline:none}
.cal{user-select:none}
.calcab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calcab b{font-family:'Space Grotesk';font-size:15px;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .dl{font-size:10px;text-align:center;color:var(--tenue);font-weight:700;letter-spacing:.06em}
.cd{border:1px solid var(--linea);border-radius:8px;padding:5px 2px 4px;text-align:center;cursor:pointer;background:#fff;min-height:42px}
.cd:hover{border-color:var(--marca);background:#FCF4F3}
.cd b{display:block;font-size:12.5px;font-family:'IBM Plex Mono'}
.cd i{display:block;width:100%;height:3px;border-radius:2px;margin-top:4px}
.cd i.bien{background:#3FD98C}.cd i.poco{background:var(--ambar)}.cd i.lleno{background:#E2E5EC}
.cd.hoy{border-color:var(--grafito);border-width:2px}
.cd.no{opacity:.32;cursor:default;background:#F6F7FA}
.cd.no:hover{border-color:var(--linea);background:#F6F7FA}
.calleg{display:flex;gap:12px;margin-top:8px;font-size:10.5px;color:var(--tenue)}
.calleg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px}
.calleg i.bien{background:#3FD98C}.calleg i.poco{background:var(--ambar)}.calleg i.lleno{background:#E2E5EC}
.horas{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.horas .btn{min-width:66px}
#idiomabox{margin-top:14px;padding:0 8px}
#idiomacab{display:none}
#idiomacab .idioma{background:rgba(255,255,255,.08)}
.idioma{display:flex;gap:4px;background:#1B2040;border-radius:8px;padding:3px}
.idioma button{flex:1;background:none;border:0;color:#8B92B8;font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.08em;padding:5px;border-radius:6px;cursor:pointer}
.idioma button.on{background:var(--marca);color:#fff}
@media(max-width:980px){#idiomabox{position:absolute;top:12px;right:12px;margin:0;padding:0;width:82px}}
aside{position:relative}
#pie .sync{width:8px;height:8px;border-radius:99px;background:#3FD98C;flex:0 0 8px;align-self:center;margin-left:-4px}
#pie .sync.ok{background:#3FD98C;animation:late 3s infinite}
#pie .sync.pend{background:#E5A00D;animation:late .8s infinite}
#pie .sync.err{background:var(--marca);animation:none}
@keyframes late{0%,100%{opacity:1}50%{opacity:.25}}
#pie .pbtn.mic{background:rgba(255,255,255,.13)}
#pie .pbtn.mic.on{background:var(--marca);border-color:var(--marca)}
.micaviso{background:#FFFBF2;border:1px solid #F0D9A8;border-radius:9px;padding:9px 11px;font-size:12.5px;margin-top:10px;color:#6B5312}
/* línea de tiempo 360 */
.linea{display:flex;flex-direction:column}
.ev{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #EEF0F5}
.ev .evf{width:108px;flex:0 0 108px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--tenue)}
.ev .evf small{display:block;font-size:10.5px;opacity:.75}
.ev .evc{flex:1;min-width:0;font-size:13.5px}
.ev .evi{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap}
.ev.trat{border-left:3px solid var(--marca);padding-left:10px}
.ev.cob{border-left:3px solid #2E9E5B;padding-left:10px}
.ev.pres{border-left:3px solid #3B4076;padding-left:10px}
.ev.lab{border-left:3px solid #8B5CF6;padding-left:10px}
.ev.cita{border-left:3px solid #E5A00D;padding-left:10px}
.ev.doc{border-left:3px solid var(--linea);padding-left:10px}
@media(max-width:700px){.ev{flex-wrap:wrap}.ev .evf{width:auto;flex:0 0 auto}.ev .evi{margin-left:auto}}
.gabrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.gmini{background:#fff;border:1px solid var(--linea);border-top:3px solid var(--c);border-radius:10px;padding:11px 12px;box-shadow:var(--sombra)}
.gmini.ocu{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,#fff),#fff)}
.gmini b{font-family:'Space Grotesk';font-size:13.5px}
.gmini .gnom{font-family:'Space Grotesk';font-size:16px;margin-top:6px;letter-spacing:-.02em}
.gsec{cursor:pointer;transition:.15s;border-left:3px solid var(--marca)}
.gsec:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(36,42,77,.12)}
.gsec h3{font-size:17px}
.migas{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--linea);
  border-radius:10px;padding:8px 12px;margin-bottom:14px;box-shadow:var(--sombra)}
.migas .mfin{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.pasos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.pasos ol{padding-left:18px;font-size:13px;margin:6px 0}
.pasos li{margin-bottom:4px}
@media(max-width:700px){.pasos{grid-template-columns:1fr}.migas .mfin{margin-left:0;width:100%}}
.sub{font-size:12.5px!important;padding-left:26px!important;opacity:.9}
nav .sub{border-left:2px solid rgba(255,255,255,.14);margin-left:10px!important;border-radius:0 8px 8px 0!important}
nav .sub.on{background:var(--marca)!important;color:#fff!important;opacity:1}
@media(max-width:980px){nav .sub{padding-left:11px!important;margin-left:0!important;border-left:0}}
.abanico{display:inline-flex;align-items:flex-end;gap:3px;margin-left:8px;cursor:pointer;position:relative;top:3px;vertical-align:middle}
.abanico .hoja{display:block;width:30px;height:30px;transform-origin:50% 96%;transform-style:preserve-3d;
  animation:abanicar .38s cubic-bezier(.4,0,.6,1) infinite alternate;will-change:transform;filter:drop-shadow(-2px 2px 2px rgba(20,25,50,.22))}
.abanico svg{width:100%;height:100%;display:block}
.abanico.mini .hoja{width:24px;height:24px}
.abanico.campo{margin-left:6px;top:0;transform:translateY(4px)}
.abanico.campo .hoja{width:22px;height:22px}
input.falta,textarea.falta{border-color:var(--ambar);background:#FFFDF6}
input.falta:focus{outline-color:var(--ambar)}

.abanico.grande .hoja{width:46px;height:46px;animation-duration:.26s}
.abanico i{font-style:normal;font-size:10px;font-weight:800;background:var(--ambar);color:#3A2A00;border-radius:99px;

const mem={};
const Store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k); return r?r.value:null;} }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch(e){}
    return mem[k]??null;
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){await window.storage.set(k,v); return true;} }catch(e){}
    try{ localStorage.setItem(k,v); return true; }catch(e){ return false; }
  },
  async del(k){
    delete mem[k];
    try{ if(window.storage){await window.storage.delete(k);} }catch(e){}
    try{ localStorage.removeItem(k); }catch(e){}
  }
};

function resumenDia(f){
  const cit=DB.citas.filter(c=>c.fecha===f&&c.estado!=='hecha');
  const man=cit.filter(c=>c.hora<'14:00'), tar=cit.filter(c=>c.hora>='14:00');
  const docs=DB.dentistas.filter(d=>d.activo!==false&&estadoTrab(d,f)==='trabaja');
  const slots=huecos(f).length+cit.length;
  const min=cit.reduce((a,c)=>a+(Number(c.dur)||30),0);
  const hor=horarioHoy(new Date(f+'T00:00:00').getDay());
  const capacidad=hor?((Number(hor[1].slice(0,2))*60-Number(hor[0].slice(0,2))*60)*docs.length):0;
  return {cit,man,tar,docs,min,capacidad,ocupacion:capacidad?Math.round(min/capacidad*100):0,hor};
}

function tictac(){
  const n=new Date(), est=estadoClinica();
  const el=id=>document.getElementById(id);
  if(!el('piehora')) return;
  el('piehora').textContent=n.toTimeString().slice(0,5);
  el('piedia').textContent=n.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  el('pieluz').className='pluz '+(est.abierto?'on':'off');
  if(DB){
    const r=resumenDia(hoy());
    el('piehorario').textContent=r.hor?`· ${tt('Hoy')} ${r.hor[0]}–${r.hor[1]} · ${tt('os esperamos')}`:'· '+tt('Hoy cerrado');
    const b=el('piecarga');
    b.textContent=`${r.cit.length} ${tt('citas')} · ${r.man.length} ${tt('mañana')} / ${r.tar.length} ${tt('tarde')}`;
    b.className='pbtn carga'+(r.ocupacion<40?' floja':r.ocupacion>85?' llena':'');
  }
  el('pieestado').textContent=tt(est.abierto?'Abierto':'Cerrado');
  const sig=DB?DB.citas.filter(c=>c.fecha===hoy()&&(c.hora>n.toTimeString().slice(0,5))&&c.estado!=='hecha').sort((a,b)=>a.hora.localeCompare(b.hora))[0]:null;
  const sil=DB?enSilla():null;
  const _=0;
  const espera=DB?DB.citas.filter(c=>c.fecha===hoy()&&c.estado==='llegado').length:0;
  el('piesig').textContent=espera?(espera+' '+tt('en sala de espera')):(sil?(tt('En silla')+': '+(P(sil.paciente)?nombreP(sil.paciente):'paciente')):
    (sig?(tt('Siguiente')+' '+sig.hora+' · '+(P(sig.paciente)?nombreP(sig.paciente):sig.nombreLibre||'')):''));
}

  if(RUTAS_GESTION.includes(ruta)&&!DESBLOQ){ m.innerHTML=puertaGestion(); traducirDOM(); tictac(); return; }

}

/* helpers de datos */
const P=id=>DB.pacientes.find(p=>p.id===id);
const nombreP=id=>{const p=P(id);return p?`${p.nombre} ${p.apellidos}`.trim():'—';};
function pendientePaciente(id){
  const pres=DB.presupuestos.filter(x=>x.paciente===id&&x.estado==='aceptado').reduce((a,b)=>a+total(b),0);
  const pag=DB.cobros.filter(x=>x.paciente===id).reduce((a,b)=>a+Number(b.importe||0),0);
  return pres-pag;
}
const total=pr=>pr.lineas.reduce((a,l)=>a+(Number(l.pvp)||0)*(Number(l.cant)||1),0)*(1-(Number(pr.dto)||0)/100);
const costeTotal=pr=>pr.lineas.reduce((a,l)=>a+(Number(l.coste)||0)*(Number(l.cant)||1),0);
function financiacion(importe,n,tin){
  n=Number(n||DB.clinica.finCuotas||12); tin=Number(tin??DB.clinica.finTIN??15);
  const i=tin/100/12;
  const cuota=i? importe*i/(1-Math.pow(1+i,-n)) : importe/n;
  const tot=cuota*n;
  return {n,tin,cuota,total:tot,intereses:tot-importe,tae:(Math.pow(1+i,12)-1)*100};
}

let diaAgenda=null;
const H0=8,H1=21;
function vAgenda(){
  const h=diaAgenda||hoy();

  const prox=DB.citas.filter(c=>c.fecha>hoy()).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).slice(0,10);
  const sinFirma=DB.pacientes.filter(p=>!p.consent||!p.consent.firma).length;
  const labVence=DB.lab.filter(l=>l.estado!=='entregado'&&l.previsto&&l.previsto<=h).length;
  const bajoStock=DB.stock.filter(s=>Number(s.cant)<=Number(s.min||0)).length;
  const cobrado=DB.cobros.filter(c=>c.fecha&&c.fecha.slice(0,7)===h.slice(0,7)).reduce((a,c)=>a+Number(c.importe||0),0);
  const filas=[];
  for(let m=H0*60;m<H1*60;m+=30) filas.push(m);
  const bloque=c=>{
    const p=P(c.paciente), firmado=p&&p.consent&&p.consent.firma;
    const den=DB.dentistas.find(d=>d.id===c.dentista)||DB.dentistas[0]||{color:'#00A29B',n:''};
    const ini=Number(c.hora.slice(0,2))*60+Number(c.hora.slice(3,5));
    const fila=Math.max(0,Math.round((ini-H0*60)/30));
    const span=Math.max(1,Math.round((Number(c.dur)||30)/30));
    const tip=`${c.hora} ${p?nombreP(c.paciente):c.nombreLibre||''} · ${c.motivo||''} · ${den.n||''}`;
    return `<div class="cita" title="${esc(tip)}" style="grid-row:${fila+2}/span ${span};--c:${den.color}" onclick="${p?`abrir('${c.paciente}')`:`editarCita('${c.id}')`}">
      <b>${esc(p?nombreP(c.paciente):c.nombreLibre||'Paciente')}</b>
      <span class="mini">${c.hora} · ${esc(c.motivo||'')}</span>
      <span class="mini">${esc(den.n)}</span>
      ${p&&!firmado?'<span class="tag bad" style="align-self:flex-start">Falta firma</span>':''}

  };

  <div class="acciones">
    <button class="btn gh sm" onclick="moverDia(-1)">←</button>

    <button class="btn gh sm" onclick="moverDia(1)">→</button>
    <button class="btn gh sm" onclick="diaAgenda=null;render()">Hoy</button>
    <button class="btn gh sm" onclick="exportarAgenda()">Exportar a Google</button>
    <button class="btn pri" onclick="nuevaCita()">Añadir cita</button></div></div>

  <div class="grid g4" style="margin-bottom:14px">
    <div class="kpi"><span>Citas del día</span><b>${hoyCitas.length}</b></div>
    <div class="kpi"><span>Fichas sin firmar</span><b style="color:${sinFirma?'var(--rojo)':'inherit'}">${sinFirma}</b></div>
    <div class="kpi"><span>Lab. vencido</span><b style="color:${labVence?'var(--ambar)':'inherit'}">${labVence}</b></div>
    <div class="kpi"><span>Cobrado este mes</span><b>${eur(cobrado)}</b></div>
  </div>

  <div class="card solo-lista">
    <div class="entre" style="margin-bottom:8px"><h3>Citas del día</h3><span class="mini">${hoyCitas.length} citas</span></div>
    ${hoyCitas.length?`<table><tbody>${hoyCitas.map(c=>{const p=P(c.paciente);const d=DB.dentistas.find(x=>x.id===c.dentista)||{};const g=DB.gabinetes.find(x=>x.id===c.gabinete)||{};
      return `<tr class="click" onclick="${p?`abrir('${c.paciente}')`:`editarCita('${c.id}')`}">
        <td class="mono" style="width:52px;border-left:3px solid ${d.color||'#7C8199'}">${c.hora}</td>

          ${p&&!(p.consent&&p.consent.firma)?'<span class="tag bad">Falta firma</span>':''}
          ${c.confirmada?'<span class="tag ok">Confirmada</span>':''}

      :'<div class="vacio">Sin citas hoy.</div>'}

  <div class="card planning-wrap">

function guardarCita(id){
  const pac=v('c_pac'), nom=v('c_nom').trim();
  let pid=pac;
  if(!pac&&nom){ const [n,...a]=nom.split(' '); pid=crearPaciente(n,a.join(' ')); }
  const datos={paciente:pid||'',nombreLibre:nom,fecha:v('c_fec'),hora:v('c_hor'),dur:Number(v('c_dur')),
    gabinete:v('c_gab'),dentista:v('c_den'),motivo:v('c_mot')};
  const ex=DB.citas.find(x=>x.id===id);
  if(ex) Object.assign(ex,datos); else DB.citas.push({id:uid(),...datos});
  if(pid){const p=P(pid); if(p&&p.proxima) p.proxima.citada=true;}
  save();cerrarModal();render();toast('Cita guardada');
}
function citarDesdeProxima(pid){
  const p=P(pid); let f=hoy();
  const m=(p.proxima.plazo||'').match(/(\d+)\s*(dia|día|semana|mes)/i);
  if(m){const d=new Date();const n=Number(m[1]);const u=m[2].toLowerCase();
    d.setDate(d.getDate()+(u.startsWith('sem')?n*7:u.startsWith('mes')?n*30:n)); f=d.toISOString().slice(0,10);}
  nuevaCita({id:'',paciente:pid,fecha:f,hora:'10:00',dur:30,gabinete:DB.gabinetes[0]?.id||'',dentista:(DB.dentistas.find(d=>d.activo!==false)||DB.dentistas[0]||{}).id||'',motivo:p.proxima.nota});
}

    consent:{firma:'',fecha:'',datos:false,tratamiento:false,imagenes:false,comercial:false},

}

function saldoPaciente(id){
  const acept=DB.presupuestos.filter(x=>x.paciente===id&&x.estado==='aceptado');
  const facturado=acept.reduce((a,b)=>a+total(b),0);
  const cob=DB.cobros.filter(c=>c.paciente===id);
  const cuenta=cob.filter(c=>c.tipo==='anticipo').reduce((a,c)=>a+Number(c.importe||0),0);
  const pagos=cob.reduce((a,c)=>a+Number(c.importe||0),0);
  const costes=acept.reduce((a,b)=>a+costeTotal(b),0)+DB.lab.filter(l=>l.paciente===id).reduce((a,l)=>a+Number(l.coste||0),0);
  return {facturado,pagos,cuenta,pendiente:facturado-pagos,margen:facturado-costes,nCob:cob.length};
}
function eventos360(id){
  const ev=[];
  DB.sesiones.filter(s=>s.paciente===id).forEach(s=>ev.push({f:s.fecha,h:s.hora||'',t:'Tratamiento',c:'trat',

  DB.presupuestos.filter(x=>x.paciente===id).forEach(x=>ev.push({f:x.fecha,h:'',t:'Presupuesto',c:'pres',
    txt:x.lineas.map(l=>l.n).join(', ').slice(0,90),det:x.estado,imp:total(x),id:x.id}));
  DB.cobros.filter(c=>c.paciente===id).forEach(c=>ev.push({f:c.fecha,h:'',t:c.tipo==='anticipo'?'A cuenta':'Cobro',c:'cob',
    txt:c.concepto||'Pago',det:c.forma,imp:c.importe,id:c.id}));
  DB.lab.filter(l=>l.paciente===id).forEach(l=>ev.push({f:l.envio,h:'',t:'Laboratorio',c:'lab',
    txt:(l.tipo||'')+' '+(l.trabajo||''),det:l.lab+' · '+l.estado+' · previsto '+fecha(l.previsto),imp:l.coste}));
  DB.citas.filter(c=>c.paciente===id).forEach(c=>ev.push({f:c.fecha,h:c.hora,t:'Cita',c:'cita',
    txt:c.revisar||c.motivo||'Consulta',
    det:[(DB.dentistas.find(d=>d.id===c.dentista)||{}).n,c.estado==='hecha'?'realizada':(c.fecha>=hoy()?(c.confirmada?'confirmada':'pendiente de confirmar'):'no registrada'),
      c.waEnviado?'avisado por WhatsApp':''].filter(Boolean).join(' · ')}));
  const p=P(id);
  if(p.consent&&p.consent.fecha) ev.push({f:p.consent.fecha.slice(0,10),h:'',t:'RGPD',c:'doc',txt:'Consentimiento firmado',det:'protección de datos y tratamiento'});
  if(p.alta) ev.push({f:p.alta,h:'',t:'Alta',c:'doc',txt:'Alta del paciente',det:p.origen||''});
  return ev.sort((a,b)=>(b.f+b.h).localeCompare(a.f+a.h));
}

      <div class="evf">${fecha(e.f)}${e.h?`<small>${e.h}</small>`:''}</div>

function textoLegal(){
  const cl=DB.clinica;
  return `<h4>Responsable del tratamiento</h4>${esc(cl.nombre||'Power Dent')}${cl.nif?` · NIF ${esc(cl.nif)}`:''}${cl.dir?` · ${esc(cl.dir)}, ${esc(cl.cp)} ${esc(cl.ciudad)}`:''}${cl.email?` · ${esc(cl.email)}`:''}${cl.dpd?` · Contacto DPD: ${esc(cl.dpd)}`:''}.
  <h4>Finalidad</h4>Prestación de asistencia odontológica, elaboración y conservación de la historia clínica, gestión de citas, presupuestos, facturación y trazabilidad de prótesis y material.
  <h4>Legitimación</h4>Ejecución del contrato de servicios sanitarios, cumplimiento de obligaciones legales (Ley 41/2002 de autonomía del paciente y documentación clínica) y consentimiento del interesado para las finalidades opcionales marcadas.
  <h4>Conservación</h4>La historia clínica se conserva un mínimo de 5 años desde el alta de cada proceso asistencial; los datos fiscales, durante los plazos legales aplicables.
  <h4>Destinatarios</h4>Laboratorio protésico y profesionales sanitarios que intervengan en el tratamiento, entidades aseguradoras cuando proceda, y Administración cuando la ley lo exija. No se realizan transferencias internacionales.

  <h4>Grabaciones clínicas</h4>Las notas de voz de la sesión se registran como parte de la historia clínica, con la finalidad exclusiva de documentar el acto realizado, y quedan bajo custodia de la clínica.

let firmaCtx=null,firmando=false,firmaVacia=true;
function iniciarFirma(){
  const c=document.getElementById('firma'); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr;
  try{ firmaCtx=c.getContext('2d'); }catch(e){ firmaCtx=null; }
  if(!firmaCtx) return;
  firmaCtx.scale(dpr,dpr);
  firmaCtx.lineWidth=2.2; firmaCtx.lineCap='round'; firmaCtx.strokeStyle='#242A4D';
  const pos=e=>{const b=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top];};
  const down=e=>{e.preventDefault();firmando=true;firmaVacia=false;firmaCtx.beginPath();firmaCtx.moveTo(...pos(e));};
  const move=e=>{if(!firmando)return;e.preventDefault();firmaCtx.lineTo(...pos(e));firmaCtx.stroke();};
  const up=()=>firmando=false;
  c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);
  addEventListener('pointerup',up);c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchmove',move,{passive:false});
}
function limpiarFirma(){const c=document.getElementById('firma');firmaCtx.clearRect(0,0,c.width,c.height);firmaVacia=true;}
function guardarFirma(){
  const p=P(pacienteAbierto);
  if(firmaVacia) return toast('Falta la firma del paciente');
  if(!p.consent.datos||!p.consent.tratamiento) return toast('Marca los dos consentimientos obligatorios');
  p.consent.firma=document.getElementById('firma').toDataURL('image/png');
  p.consent.fecha=new Date().toISOString();
  save();render();toast('Ficha firmada y registrada');
}

let mediaRec=null,chunks=[],recAudio=null,recT=null,recSeg=0;
function iniciarGrabadora(){ recAudio=null; }
async function toggleRec(){
  const box=document.getElementById('recbox'),btn=document.getElementById('recbtn'),msg=document.getElementById('recmsg');
  if(mediaRec&&mediaRec.state==='recording'){ mediaRec.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec=new MediaRecorder(stream,{audioBitsPerSecond:32000}); chunks=[];
    mediaRec.ondataavailable=e=>chunks.push(e.data);
    mediaRec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop()); clearInterval(recT);
      const blob=new Blob(chunks,{type:mediaRec.mimeType});
      const fr=new FileReader();
      fr.onload=()=>{ recAudio=fr.result; msg.textContent=`Audio listo · ${(blob.size/1048576).toFixed(1)} MB — guarda la sesión`; };
      fr.readAsDataURL(blob);
      recAudio='...'; box.classList.remove('on'); btn.textContent='Grabar';
    };
    mediaRec.start(); recSeg=0; box.classList.add('on'); btn.textContent='Detener';
    msg.textContent='Grabando la sesión';
    recT=setInterval(()=>{recSeg++;document.getElementById('rectime').textContent=String(Math.floor(recSeg/60)).padStart(2,'0')+':'+String(recSeg%60).padStart(2,'0');},1000);
  }catch(e){ msg.textContent='Sin permiso de micrófono. Actívalo en el navegador.'; }
}
function guardarSesion(){
  const p=P(pacienteAbierto);
  const s={id:uid(),paciente:p.id,fecha:v('s_fec'),hora:new Date().toTimeString().slice(0,5),
    acto:v('s_acto'),piezas:v('s_piezas'),nota:v('s_nota'),audio:'',audioNo:false};
  if(recAudio&&recAudio!=='...'){
    if(recAudio.length>3.5e6){ descargarAudio(recAudio,p); s.audioNo=true; } else s.audio=recAudio;
  }
  const matId=v('s_mat'),cant=Number(v('s_cant')||0);
  if(matId&&cant>0){
    const it=DB.stock.find(x=>x.id===matId);
    if(it){ it.cant=Number(it.cant)-cant; it.consumos=it.consumos||[]; it.consumos.push({paciente:p.id,cant,fecha:s.fecha}); s.material=[{id:matId,n:it.n,cant,coste:Number(it.coste||0)*cant}]; }
  }
  DB.sesiones.push(s); save(); recAudio=null; render(); toast('Sesión guardada en la historia');
}
function descargarAudio(dataUrl,p){
  const a=document.createElement('a'); a.href=dataUrl;

function nuevoCobro(pacId){

  modal(`<h2>Registrar cobro</h2><div class="grid g2" style="margin-top:12px">
    <div class="f"><label>Paciente</label><select id="co_pac">${pacs}</select></div>
    <div class="f"><label>Fecha</label><input type="date" id="co_fec" value="${hoy()}"></div>
    <div class="f"><label>Importe</label><input type="number" id="co_imp" step="0.01" value="${pacId?Math.max(0,pendientePaciente(pacId)).toFixed(2):''}"></div>
    <div class="f"><label>Tipo</label><select id="co_tipo"><option value="pago">Pago de tratamiento</option><option value="anticipo">Entrega a cuenta</option></select></div>
    <div class="f"><label>Forma de pago</label><select id="co_for" onchange="pintarPago()">
      <option>Tarjeta (TPV)</option><option>Efectivo</option><option>Bizum</option><option>Transferencia</option>
      <option>Enlace de pago</option><option>Financiación</option><option>Seguro</option></select></div>

}
function pintarPago(){
  const box=document.getElementById('co_extra'); if(!box) return;
  const f=v('co_for'), pid=v('co_pac'), imp=v('co_imp')||0;
  box.innerHTML=f==='Enlace de pago'?`<button class="btn gh sm" onclick="cobrarPorEnlace('${pid}',${Number(imp)||0})">Enviar enlace al paciente</button>
      <span class="mini">Se manda por WhatsApp con el importe.</span>`
   :f==='Tarjeta (TPV)'?`<button class="btn gh sm" onclick="abrirPasarela()">Abrir TPV / pasarela</button>`
   :f==='Transferencia'||f==='Bizum'?`<button class="btn gh sm" onclick="abrirBanco()">Abrir banco</button>
      <span class="mini">${esc(DB.clinica.iban||'Pon tu IBAN o Bizum en Ajustes')}</span>`:'';
}
function guardarCobro(){
  DB.cobros.push({id:uid(),paciente:v('co_pac'),fecha:v('co_fec'),importe:Number(v('co_imp')||0),forma:v('co_for'),tipo:v('co_tipo')||'pago',concepto:v('co_con')||(v('co_tipo')==='anticipo'?'Entrega a cuenta':'Pago de tratamiento'),num:(DB.cobros.length+1)});
  save();cerrarModal();render();toast('Cobro registrado');
}
function borrarCobro(id){ if(!confirm('¿Eliminar el cobro?'))return; DB.cobros=DB.cobros.filter(c=>c.id!==id); save(); render(); }
function vCobros(){
  const mes=hoy().slice(0,7);
  const cob=[...DB.cobros].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const mesTot=cob.filter(c=>c.fecha.slice(0,7)===mes).reduce((a,c)=>a+Number(c.importe||0),0);

    ${cob.slice(0,60).map(c=>`<tr><td>${fecha(c.fecha)}</td><td>${esc(nombreP(c.paciente))}<div class="mini">${esc(c.concepto||'')}</div></td>
    <td><span class="tag">${esc(c.forma)}</span></td><td class="num">${eur(c.importe)}</td>
    <td class="num" style="white-space:nowrap"><button class="btn gh sm" onclick="imprimirFactura('${c.id}')">Recibo</button>

    ${deuda.length?`<table><tbody>${deuda.map(x=>`<tr class="click" onclick="abrir('${x.p.id}')"><td>${esc(nombreP(x.p.id))}</td><td class="mini">${esc(x.p.tel||'')}</td><td class="num" style="color:var(--rojo)">${eur(x.d)}</td></tr>`).join('')}</tbody></table>`:'<div class="vacio">Todo cobrado.</div>'}</div>

const TIPOS_LAB=['Corona','Puente','Incrustación','Carilla','Placa de descarga','Férula deportiva','Alineadores / férulas','Retenedor','Prótesis parcial','Prótesis completa','Aparato de ortodoncia','Cubeta individual','Barra sobre implantes'];
const FASES=['Impresión enviada','Prueba en boca','Terminado en lab','Recibido en clínica','Colocado al paciente'];
function nuevoLab(pacId){
  const pacs=DB.pacientes.map(p=>`<option value="${p.id}" ${pacId===p.id?'selected':''}>${esc(nombreP(p.id))}</option>`).join('');
  modal(`<h2>Trabajo de laboratorio</h2><div class="grid g2" style="margin-top:12px">
    <div class="f"><label>Paciente</label><select id="l_pac">${pacs}</select></div>
    <div class="f"><label>Laboratorio / protésico</label><input id="l_lab" list="llabs" placeholder="Nombre del laboratorio">
      <datalist id="llabs">${[...new Set(DB.lab.map(l=>l.lab).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="f"><label>Tipo de trabajo</label><select id="l_tipo">${TIPOS_LAB.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="f"><label>Descripción</label><input id="l_tra" placeholder="Zirconio A2 / placa superior 2 mm"></div>
    <div class="f"><label>Piezas o arcada</label><input id="l_pie" placeholder="26 · superior · inferior"></div>
    <div class="f"><label>Material / color</label><input id="l_mat" placeholder="Zirconio, PMMA, cromo-cobalto…"></div>
    <div class="f"><label>Fecha de envío</label><input type="date" id="l_env" value="${hoy()}"></div>
    <div class="f"><label>Días de entrega</label><input type="number" id="l_dias" value="7"></div>
    <div class="f"><label>Coste laboratorio (€)</label><input type="number" id="l_cos" step="0.01" value="0"></div>
    <div class="f"><label>Cita de colocación prevista</label><input type="date" id="l_cita"></div>
  </div>
  <div class="fila" style="justify-content:flex-end"><button class="btn gh" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="guardarLab()">Guardar trabajo</button></div>`);
}
function guardarLab(){
  const env=v('l_env'),d=Number(v('l_dias')||0);
  const prev=new Date(env+'T00:00:00'); prev.setDate(prev.getDate()+d);
  DB.lab.push({id:uid(),paciente:v('l_pac'),lab:v('l_lab'),tipo:v('l_tipo'),trabajo:v('l_tra'),piezas:v('l_pie'),material:v('l_mat'),
    envio:env,dias:d,previsto:prev.toISOString().slice(0,10),coste:Number(v('l_cos')||0),cita:v('l_cita'),
    estado:'enviado',fases:{'Impresión enviada':hoy()}});
  save();cerrarModal();render();toast('Trabajo registrado');
}
function tablaLab(l){
  const est={enviado:'tag info',recibido:'tag warn',entregado:'tag ok'};
  return `<table><thead><tr><th>Paciente</th><th>Trabajo</th><th>Laboratorio</th><th>Fases</th><th>Previsto</th><th>Estado</th><th class="num">Coste</th><th></th></tr></thead><tbody>
  ${l.sort((a,b)=>a.previsto.localeCompare(b.previsto)).map(x=>{
    const tarde=x.estado!=='entregado'&&x.previsto<hoy(); const f=x.fases||{};
    return `<tr><td><b>${esc(nombreP(x.paciente))}</b><div class="mini">${x.cita?'coloca '+fecha(x.cita):''}</div></td>
    <td><span class="tag info">${esc(x.tipo||'Trabajo')}</span> ${esc(x.trabajo||'')}<div class="mini">${esc(x.piezas||'')} ${x.material?'· '+esc(x.material):''}</div></td>
    <td class="mini">${esc(x.lab||'—')}<div>env. ${fecha(x.envio)}</div></td>
    <td><div class="fases">${FASES.map(n=>`<span class="${f[n]?'ok':''}" title="${esc(n)}${f[n]?' · '+fecha(f[n]):''}" onclick="toggleFase('${x.id}','${esc(n)}')"></span>`).join('')}</div>
      <div class="mini">${esc(Object.keys(f).slice(-1)[0]||'sin fases')}</div></td>
    <td class="mini" style="${tarde?'color:var(--rojo);font-weight:600':''}">${fecha(x.previsto)}${tarde?' ⚠':''}</td>
    <td><select class="${est[x.estado]}" style="padding:3px 6px;font-size:12px;width:auto" onchange="cambiarLab('${x.id}',this.value)">
      ${['enviado','recibido','entregado'].map(e=>`<option ${x.estado===e?'selected':''}>${e}</option>`).join('')}</select></td>
    <td class="num">${eur(x.coste)}</td><td><button class="btn gh sm" onclick="borrarLab('${x.id}')">×</button></td></tr>`;}).join('')}</tbody></table>`;
}
function toggleFase(id,fase){
  const x=DB.lab.find(l=>l.id===id); x.fases=x.fases||{};
  if(x.fases[fase]) delete x.fases[fase]; else x.fases[fase]=hoy();
  if(x.fases['Colocado al paciente']) x.estado='entregado';
  else if(x.fases['Recibido en clínica']) x.estado='recibido';
  save(); render();
}
function cambiarLab(id,e){ const x=DB.lab.find(l=>l.id===id); x.estado=e; save(); render(); }
function borrarLab(id){ DB.lab=DB.lab.filter(l=>l.id!==id); save(); render(); }
function vLab(){
  const l=DB.lab, pend=l.filter(x=>x.estado!=='entregado'), tarde=pend.filter(x=>x.previsto<hoy());
  const placas=pend.filter(x=>/placa|f[eé]rula|alineador|retenedor/i.test(x.tipo||''));
  const porTipo={}; pend.forEach(x=>{const k=x.tipo||'Otros';porTipo[k]=(porTipo[k]||0)+1;});
  return `<div class="topbar"><div><h1>Laboratorio y placas</h1><p>Prótesis, férulas y alineadores: fases, plazos y coste</p></div>
  <div class="acciones"><button class="btn pri" onclick="nuevoLab()">Nuevo trabajo</button></div></div>
  <div class="grid g4" style="margin-bottom:14px">
    <div class="kpi"><span>En curso</span><b>${pend.length}</b></div>
    <div class="kpi"><span>Placas y férulas</span><b>${placas.length}</b></div>
    <div class="kpi"><span>Fuera de plazo</span><b style="color:${tarde.length?'var(--rojo)':'inherit'}">${tarde.length}</b></div>
    <div class="kpi"><span>Coste en curso</span><b>${eur(pend.reduce((a,x)=>a+Number(x.coste||0),0))}</b></div></div>
  ${Object.keys(porTipo).length?`<div class="card" style="padding:12px 16px"><div class="fila">${Object.entries(porTipo).map(([k,n])=>`<span class="tag info">${esc(k)}: ${n}</span>`).join('')}</div></div>`:''}
  <div class="card"><div class="entre"><h3>Trabajos</h3><span class="mini">Toca los puntos para marcar fases: impresión, prueba, terminado, recibido, colocado</span></div><hr>
  ${l.length?tablaLab([...l]):'<div class="vacio">Sin trabajos de laboratorio.</div>'}</div>`;
}

const deptosUsados=()=>{
  const d=[...new Set(DB.stock.map(s=>s.depto||'Sin departamento'))];

};
const contadoYa=s=>s.contado!==undefined&&s.contado!=='';
const hay=s=>Number(contadoYa(s)?s.contado:s.cant||0);
const aPedir=s=>{
  if(!contadoYa(s)&&!Number(s.cant)) return 0;
  const h=hay(s), min=Number(s.min||0), obj=Number(s.obj||s.min||0);
  if(h>min) return 0;
  return Math.max(0,Math.round(obj-h));
};

function agrupadoPedido(){
  const g={};
  DB.stock.filter(s=>s.activo!==false&&aPedir(s)>0).forEach(s=>{
    const k=s.prov||'Sin proveedor'; (g[k]=g[k]||[]).push(s);
  });
  return g;
}
function resumenHTML(){
  const g=agrupadoPedido();
  if(!Object.keys(g).length) return '<div class="vacio">Nada por debajo del stock de seguridad.</div>';
  return Object.entries(g).map(([prov,items])=>`<div style="margin-bottom:14px">
    <b>${esc(prov)}</b> <span class="mini">${[...new Set(items.map(s=>s.dia).filter(Boolean))].join(' / ')||'sin día fijado'}</span>
    <table><tbody>${items.map(s=>`<tr><td>${esc(s.n)}</td><td class="mini">hay ${hay(s)} · mín. ${s.min||0} · objetivo ${s.obj||s.min||0} ${s.ud?'('+esc(s.ud)+')':''}</td>
    <td class="num pedir hay">${aPedir(s)}</td></tr>`).join('')}</tbody></table></div>`).join('');
}

  const n=prompt('Nuevo nombre para «'+d+'»',d); if(!n||n===d) return;
  DB.stock.forEach(s=>{ if((s.depto||'Sin departamento')===d) s.depto=n; });
  DB.deptos=(DB.deptos||[]).map(x=>x===d?n:x); save(); render();
}

function aplicarCatalogo(){
  let orden=Math.max(0,...DB.stock.map(s=>s.orden||0)), n=0;
  CATALOGO.forEach(x=>{
    if(DB.stock.some(s=>sinAcento(s.n)===sinAcento(x.n))) return;
    DB.stock.push({id:uid(),n:x.n,depto:x.d,prov:'',dia:'',cant:0,contado:'',min:x.m,obj:x.o,ud:x.u,
      coste:0,diasEntrega:3,orden:++orden,activo:true,consumos:[],historial:[]});
    n++;
  });
  DB.deptos=[...new Set([...(DB.deptos||[]),...CATALOGO.map(x=>x.d)])];
  save(); cerrarModal(); render(); toast(n+' referencias cargadas');
}

function borrarProd(id){
  const s=DB.stock.find(x=>x.id===id);
  if(!confirm('¿Eliminar «'+s.n+'» del almacén? Si solo quieres dejar de contarlo, usa ∅ para anularlo.')) return;
  DB.stock=DB.stock.filter(x=>x.id!==id); save(); render();
}
function moverProd(id,dir){
  const s=DB.stock.find(x=>x.id===id);
  const hermanos=DB.stock.filter(x=>(x.depto||'Sin departamento')===(s.depto||'Sin departamento')).sort((a,b)=>(a.orden||0)-(b.orden||0));
  const i=hermanos.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=hermanos.length) return;
  const o=hermanos[i].orden||i; hermanos[i].orden=hermanos[j].orden||j; hermanos[j].orden=o;
  save(); render();
}
function soltar(ev,depto,sobreId){
  ev.preventDefault(); ev.stopPropagation();
  const s=DB.stock.find(x=>x.id===arrastrado); if(!s) return;
  s.depto=depto;
  if(sobreId&&sobreId!==arrastrado){
    const dest=DB.stock.find(x=>x.id===sobreId);
    s.orden=(Number(dest.orden)||0)-0.5;
  } else s.orden=Math.max(0,...DB.stock.map(x=>x.orden||0))+1;
  DB.stock.filter(x=>(x.depto||'Sin departamento')===depto).sort((a,b)=>(a.orden||0)-(b.orden||0))
    .forEach((x,i)=>x.orden=i+1);
  arrastrado=null; save(); render();
}
function guardarConteo(){
  const lineas=DB.stock.filter(s=>s.activo!==false).map(s=>({n:s.n,depto:s.depto,prov:s.prov,dia:s.dia,
    seguridad:Number(s.min||0),contado:Number(s.contado??s.cant??0),pedir:aPedir(s)}));
  DB.conteos=[...(DB.conteos||[]),{id:uid(),fecha:hoy(),hora:new Date().toTimeString().slice(0,5),lineas}].slice(-30);
  DB.stock.forEach(s=>{ if(s.contado!==''&&s.contado!==undefined) s.cant=Number(s.contado); });
  save(); render(); toast('Conteo guardado · '+lineas.filter(l=>l.pedir>0).length+' referencias a pedir');
}

  }
  if(!Object.keys(g).length) return `${DB.clinica.nombre||'PowerDent'} · conteo ${n.toLocaleDateString('es-ES')}\nTodo por encima del stock de seguridad. No hace falta pedir nada.`;
  let t=`${DB.clinica.nombre||'PowerDent'} · pedido del ${n.toLocaleDateString('es-ES')}\n`;
  Object.entries(g).forEach(([prov,items])=>{
    const dias=[...new Set(items.map(s=>s.dia).filter(Boolean))].join('/');
    t+=`\n*${prov}*${dias?` (entrega ${dias})`:''}\n`;
    items.forEach(s=>{ t+=`• ${s.n}: pedir ${aPedir(s)} ${s.ud||'ud'} (hay ${hay(s)}, objetivo ${s.obj||s.min||0})
`; });
  });
  t+=`\n${Object.values(g).flat().length} referencias en ${Object.keys(g).length} proveedor(es).`;
  return t;
}

function pedidosDesdeConteo(){
  const g=agrupadoPedido();

    const pr=DB.proveedores.find(p=>p.n===prov);

    DB.pedidos.push({id:uid(),prov,fecha:hoy(),previsto:d.toISOString().slice(0,10),estado:'borrador',nota:'Generado desde el conteo',

/* ══════════ 10B. MODO SILLÓN, CHECK-IN Y WHATSAPP ══════════ */
const MESES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
const SEM={domingo:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6};
const masDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
function fechaES(txt){
  const t=sinAcento(txt); let f=null,m;
  if(/pasado manana/.test(t)) f=masDias(2);
  else if(/\bmanana\b/.test(t)) f=masDias(1);
  if(!f&&(m=t.match(/(?:en|dentro de)\s+([a-z0-9\s]+?)\s*(dias?|semanas?|meses?)/))){
    const n=numES(m[1])||1; f=masDias(m[2].startsWith('sem')?n*7:m[2].startsWith('mes')?n*30:n);
  }
  if(!f&&(m=t.match(/(?:el\s+)?([a-z0-9]+(?:\s+y\s+[a-z]+)?)\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)/))){
    const d=numES(m[1]), mes=MESES[m[2]];
    if(d&&mes){ const hoyD=new Date(); let y=hoyD.getFullYear();
      let cand=new Date(y,mes-1,d); if(cand<new Date(hoyD.toDateString())) cand=new Date(y+1,mes-1,d);
      f=new Date(cand.getTime()-cand.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  }
  if(!f&&(m=t.match(/\b(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/))){
    const obj=SEM[m[1]], hoyD=new Date(); let dif=(obj-hoyD.getDay()+7)%7;
    if(dif===0||/que viene|proximo|siguiente/.test(t)) dif=dif===0?7:dif;
    f=masDias(dif||7);
  }
  let hora=null;
  if((m=t.match(/a\s+las?\s+([a-z0-9]+(?:\s*y\s*(?:media|cuarto)|\s*menos\s*cuarto)?)(?:\s*(?::|\.)\s*(\d{2}))?/))){
    const bruto=m[1]; let hh=numES(bruto.replace(/y (media|cuarto)|menos cuarto/,''))||null;
    let mm=m[2]?Number(m[2]):0;
    if(/y media/.test(bruto)) mm=30; else if(/y cuarto/.test(bruto)) mm=15; else if(/menos cuarto/.test(bruto)){ mm=45; hh=(hh||1)-1; }
    if(hh!==null){
      if(/tarde|noche/.test(t)&&hh<12) hh+=12;
      if(hh<8&&!/manana|madrugada/.test(t)) hh+=12;
      hora=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    }
  }
  return {fecha:f,hora};
}

function telWA(p){

/* ══════════ 10C. DICTADO A TEXTO, CALENDARIO Y GOOGLE ══════════ */
const DICT={rec:null,activo:false,texto:'',parcial:''};
function toggleDictado(pid){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return toast('Este navegador no transcribe voz. Usa Chrome o Edge.');
  if(DICT.activo){ pararDictado(); return; }
  if(VOZ.activo){ VOZ.pausadoPorDictado=true; VOZ.activo=false; try{VOZ.rec.stop();}catch(e){} }
  DICT.rec=new SR(); DICT.rec.lang='es-ES'; DICT.rec.continuous=true; DICT.rec.interimResults=true;
  DICT.rec.onresult=e=>{
    let fin='',par='';
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; r.isFinal?fin+=r[0].transcript+' ':par+=r[0].transcript; }
    if(fin) DICT.texto+=fin;
    DICT.parcial=par; pintarDictado();
  };
  DICT.rec.onend=()=>{ if(DICT.activo){ try{DICT.rec.start();}catch(e){} } };
  DICT.activo=true; try{DICT.rec.start();}catch(e){}
  grabarAudioSesion(true);
  pintarDictado();
}
function pararDictado(){
  DICT.activo=false; try{DICT.rec.stop();}catch(e){}
  grabarAudioSesion(false);
  if(VOZ.pausadoPorDictado){ VOZ.pausadoPorDictado=false; setTimeout(toggleVoz,500); }
  pintarDictado();
}
function pintarDictado(){
  const c=document.getElementById('transcaja'), b=document.getElementById('transbtn'), t=document.getElementById('transtexto');
  if(!c) return;
  c.classList.toggle('grabando',DICT.activo);
  if(b) b.textContent=DICT.activo?'Detener y guardar':'Grabar y transcribir';
  if(t&&document.activeElement!==t) t.value=(DICT.texto+DICT.parcial).trim();
  const est=document.getElementById('transest');
  if(est) est.textContent=DICT.activo?'Escuchando y escribiendo…':(DICT.texto?'Revisa el texto y guárdalo':'Pulsa y habla: se escribe solo');
}
let audioSesion=null;
async function grabarAudioSesion(on){
  if(on){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRec=new MediaRecorder(stream,{audioBitsPerSecond:32000}); chunks=[];
      mediaRec.ondataavailable=e=>chunks.push(e.data);
      mediaRec.onstop=()=>{ stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:mediaRec.mimeType}); const fr=new FileReader();
        fr.onload=()=>{ audioSesion=fr.result; }; fr.readAsDataURL(blob); };
      mediaRec.start();
    }catch(e){ /* sin micro: seguimos solo con texto */ }
  } else if(mediaRec&&mediaRec.state==='recording') mediaRec.stop();
}
function guardarDictado(pid){
  const txt=(document.getElementById('transtexto')?.value||DICT.texto).trim();
  if(!txt) return toast('No hay nada transcrito todavía');
  if(DICT.activo) pararDictado();
  const pieza=piezaEn(txt);
  const acto=txt.split(/[.;]/)[0].slice(0,90);
  const s={id:uid(),paciente:pid,fecha:hoy(),hora:new Date().toTimeString().slice(0,5),
    acto,piezas:pieza,nota:txt,audio:'',audioNo:false};
  if(audioSesion){ if(audioSesion.length>3.5e6){ s.audioNo=true; descargarAudio(audioSesion,P(pid)); } else s.audio=audioSesion; }
  DB.sesiones.push(s); audioSesion=null; DICT.texto=''; DICT.parcial='';
  save(); render(); toast('Guardado en la historia'+(pieza?' · pieza '+pieza:''));
}
/* ---- calendario visual con huecos ---- */
let calMes=null, calPac=null;
function huecos(f,denId){
  const d=new Date(f+'T00:00:00'), hor=horarioHoy(d.getDay());
  if(!hor) return [];
  const a=Number(hor[0].slice(0,2))*60+Number(hor[0].slice(3,5)), c=Number(hor[1].slice(0,2))*60+Number(hor[1].slice(3,5));
  const del=DB.citas.filter(x=>x.fecha===f), out=[];
  for(let m=a;m<c;m+=30){
    const hh=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
    const ocupados=del.filter(x=>{const i=Number(x.hora.slice(0,2))*60+Number(x.hora.slice(3,5));return m>=i&&m<i+(Number(x.dur)||30);});
    const gabLibre=DB.gabinetes.some(g=>!ocupados.find(o=>o.gabinete===g.id));
    const denLibre=!denId||!ocupados.find(o=>o.dentista===denId);
    if(gabLibre&&denLibre) out.push(hh);
  }
  return out;
}
function calendario(pid,revisar){

  const offset=(prim.getDay()+6)%7;
  const celdas=[];

    const abierto=!!horarioHoy(new Date(f+'T00:00:00').getDay());

    celdas.push(`<div class="cd ${!abierto||pasado?'no':''} ${f===hoy()?'hoy':''}" ${abierto&&!pasado?`onclick="verHuecos('${f}','${esc(revisar||'')}')"`:''}>
      <b>${d}</b><i class="${libres>6?'bien':libres?'poco':'lleno'}"></i></div>`);

  return `<div class="cal">

  </div>`;
}

function libresEse(f,hora,dur,excluir){
  return DB.dentistas.filter(d=>d.activo!==false&&d.id!==excluir&&estadoTrab(d,f)==='trabaja'
    &&!DB.citas.some(c=>c.fecha===f&&c.dentista===d.id&&(()=>{
      const i=Number(c.hora.slice(0,2))*60+Number(c.hora.slice(3,5)), j=Number(hora.slice(0,2))*60+Number(hora.slice(3,5));
      return j<i+(Number(c.dur)||30)&&i<j+(dur||30);})()));
}
function planAusencia(denId,f){
  const t=DB.dentistas.find(x=>x.id===denId);

  modal(`<h2>Plan B · ${esc(t.n)} no viene el ${fecha(f)}</h2>

  <table style="margin-top:12px"><tbody>${citas.map(c=>{
    const p=P(c.paciente), libres=libresEse(f,c.hora,c.dur,denId);
    return `<tr><td class="mono" style="width:52px">${c.hora}</td>
    <td><b>${esc(p?nombreP(c.paciente):c.nombreLibre||'Paciente')}</b><div class="mini">${esc(c.revisar||c.motivo||'')} · ${esc(p?.tel||'sin teléfono')}</div></td>

  </tbody></table>
  <div class="fila" style="justify-content:flex-end;margin-top:12px"><button class="btn gh" onclick="cerrarModal()">Cerrar</button></div>`);
}
function pasarA(citaId){
  const c=DB.citas.find(x=>x.id===citaId), nuevo=v('pl_'+citaId);
  const antes=DB.dentistas.find(d=>d.id===c.dentista);
  c.dentista=nuevo; save();
  const den=DB.dentistas.find(d=>d.id===nuevo), p=P(c.paciente);
  if(p) avisoCambio(c,`mismo día y hora, con ${den.n}`,antes);
  cerrarModal(); render(); toast('Cita reasignada a '+den.n);
}
function reprogramar(citaId){
  const c=DB.citas.find(x=>x.id===citaId), p=P(c.paciente);
  const sug=masDias(7);
  modal(`<h2>Cambiar la cita de ${esc(p?nombreP(c.paciente):'paciente')}</h2>
  <p class="mini">Estaba el ${fecha(c.fecha)} a las ${c.hora}.</p>
  <div class="grid g2" style="margin-top:12px">

function pintarHuecosRepro(){
  const f=v('rp_f'), box=document.getElementById('rp_h'); if(!box) return;
  const libres=huecos(f,v('rp_d'));
  box.innerHTML=libres.length?libres.map(x=>`<button class="btn gh sm" onclick="confirmarRepro('${x}')">${x}</button>`).join('')
    :'<div class="vacio">Ese día está completo o cerrado.</div>';
}
function confirmarRepro(hora){
  const c=DB.citas.find(x=>x.id===window._repro), antes={fecha:c.fecha,hora:c.hora};
  c.fecha=v('rp_f'); c.hora=hora; c.dentista=v('rp_d'); c.waEnviado=null;
  const g=DB.gabinetes.find(x=>!DB.citas.some(o=>o.id!==c.id&&o.fecha===c.fecha&&o.gabinete===x.id&&o.hora===c.hora));
  if(g) c.gabinete=g.id;
  save(); cerrarModal(); render();
  toast('Cita movida al '+fecha(c.fecha)+' a las '+hora);
  avisoCambio(c,null,null,antes);
}
function avisoCambio(c,detalle,antes,fechaAntes){
  const p=P(c.paciente); if(!p) return toast('Cita sin ficha: avisa tú al paciente');
  const cl=DB.clinica, EN_=(cl.idioma||'es')==='en';
  const d=new Date(c.fecha+'T00:00:00');
  let txt;
  if(EN_){
    txt=`Hi ${p.nombre}, this is ${cl.nombre||'PowerDent'}.\n\nWe are very sorry: we have to change your appointment`+
      (fechaAntes?` on ${new Date(fechaAntes.fecha+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${fechaAntes.hora}`:'')+
      `.\n\nWe have rebooked you for ${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${c.hora}`+
      (detalle?` (${detalle})`:'')+`.\n${c.revisar?`Reason: ${c.revisar}\n`:''}`+
      `\nIf that time doesn't work, reply to this message or call us${cl.tel?` on ${cl.tel}`:''} and we'll find another slot. Sorry for the inconvenience.`;
  } else {
    txt=`Hola ${p.nombre}, te escribimos de ${cl.nombre||'PowerDent'}.\n\nLamentamos las molestias: tenemos que cambiar tu cita`+
      (fechaAntes?` del ${new Date(fechaAntes.fecha+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})} a las ${fechaAntes.hora}`:'')+
      `.\n\nTe hemos reprogramado para el ${d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})} a las ${c.hora}`+
      (detalle?` (${detalle})`:'')+`.\n${c.revisar?`Motivo: ${c.revisar}\n`:''}`+
      `\nSi no te viene bien, contéstanos a este mensaje o llámanos${cl.tel?` al ${cl.tel}`:''} y buscamos otro hueco. Disculpa de nuevo las molestias.`;
  }
  const tel=telWA(p);
  if(!tel){ copiar(txt); return toast('Sin teléfono: mensaje copiado'); }
  const w=window.open(`https://wa.me/${tel}?text=${encodeURIComponent(txt)}`,'_blank');
  if(!w){ copiar(txt); toast('Ventana bloqueada: mensaje copiado'); }
  c.waEnviado=new Date().toISOString(); save();
}

function todosContactos(){
  const out=[];
  DB.dentistas.forEach(t=>out.push({id:'t'+t.id,n:t.n,tipo:'Equipo',sub:t.rol||t.esp||'',tel:t.tel,email:t.email,fijo:true}));
  DB.proveedores.forEach(x=>out.push({id:'p'+x.id,n:x.n,tipo:'Proveedor',sub:(x.dias?x.dias+' días de entrega':''),tel:x.tel,email:x.email,fijo:true}));
  [...new Set(DB.stock.map(s=>s.prov).filter(Boolean))].forEach(n=>{
    if(!out.some(o=>o.tipo==='Proveedor'&&o.n===n)) out.push({id:'s'+n,n,tipo:'Proveedor',sub:'del almacén',tel:'',email:'',fijo:true});});
  [...new Set(DB.lab.map(l=>l.lab).filter(Boolean))].forEach(n=>out.push({id:'l'+n,n,tipo:'Laboratorio',sub:DB.lab.filter(l=>l.lab===n).length+' trabajos',tel:'',email:'',fijo:true}));
  (DB.contactos||[]).forEach(c=>out.push({...c,id:'c'+c.id,ref:c.id}));
  if(DB.clinica.jefe) out.push({id:'jefe',n:'Jefe / pedidos',tipo:'Interno',sub:'resumen de conteo',tel:DB.clinica.jefe,email:'',fijo:true});
  return out;
}

}
function entrarPaciente(){
  const q=(v('k_id')||'').trim().toLowerCase(), pin=(v('k_pin')||'').trim();
  const p=DB.pacientes.find(x=>
    numPaciente(x).toLowerCase()===q||
    (x.tel||'').replace(/\s/g,'')===q.replace(/\s/g,'')||
    (x.dni||'').toLowerCase()===q||
    (x.email||'').toLowerCase()===q);
  if(!p){ kioscoMsg='No encontramos esos datos. Pregunta en recepción.'; render(); return; }
  if(pin!==String(p.codigo||'')){ kioscoMsg='Código incorrecto.'; render(); return; }
  kioscoMsg=''; kioscoPac=p.id;
  if(!sesion||sesion.tipo!=='equipo') sesion={tipo:'paciente',id:p.id};
  render();
}
function montarGoogle(){
  const cl=DB.clinica;
  if(ruta!=='kiosco'||kioscoPac||!cl.googleId||!document.getElementById('gbtn')) return;
  const arranca=()=>{
    try{
      google.accounts.id.initialize({client_id:cl.googleId,callback:respGoogle});
      google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'outline',size:'large',width:280,text:'signin_with',locale:(cl.idioma||'es')});
    }catch(e){}
  };
  if(window.google&&google.accounts) return arranca();
  if(document.getElementById('gsi')) return;
  const s=document.createElement('script'); s.id='gsi'; s.src='https://accounts.google.com/gsi/client'; s.async=true; s.onload=arranca;
  document.head.appendChild(s);
}
function respGoogle(res){
  try{
    const datos=JSON.parse(atob(res.credential.split('.')[1]));
    const mail=(datos.email||'').toLowerCase();
    const p=DB.pacientes.find(x=>(x.email||'').toLowerCase()===mail);
    if(!p){ kioscoMsg='Esa cuenta ('+mail+') no está en la clínica. Dánosla en recepción y la vinculamos.'; render(); return; }
    kioscoPac=p.id; kioscoMsg='';
    if(!sesion||sesion.tipo!=='equipo') sesion={tipo:'paciente',id:p.id};
    render();
  }catch(e){ kioscoMsg='No hemos podido validar la cuenta.'; render(); }
}

      ${cita?`<div class="mini">Tu próxima cita: ${new Date(cita.fecha+'T00:00:00').toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'})} a las ${cita.hora}</div>`:''}</div></div>`}

function abrirBanco(){
  const u=DB.clinica.banco;

function abrirPasarela(){
  const u=DB.clinica.pasarela;
  if(!u) return toast('Pon el enlace de tu pasarela (Stripe, SumUp, Redsys…) en Ajustes');
  window.open(u.startsWith('http')?u:'https://'+u,'_blank');

function enlacePago(importe,pid){
  let u=DB.clinica.pasarela||'';
  if(!u) return '';
  u=u.replace('{importe}',String(importe).replace(',','.')).replace('{amount}',String(importe));
  if(!u.includes('{')&&!/[?&](amount|importe)=/.test(u)) u+=(u.includes('?')?'&':'?')+'amount='+importe;
  return u.startsWith('http')?u:'https://'+u;
}
function cobrarPorEnlace(pid,importe){
  const p=P(pid), u=enlacePago(importe,pid);
  if(!u) return toast('Configura la pasarela en Ajustes');
  const EN_=(DB.clinica.idioma||'es')==='en';
  const txt=EN_?`Hi ${p.nombre}, here is the secure payment link for ${eur(importe)} at ${DB.clinica.nombre||'PowerDent'}:\n${u}\n\nOnce paid you'll get the receipt at the clinic. Thank you!`
   :`Hola ${p.nombre}, aquí tienes el enlace seguro para pagar ${eur(importe)} en ${DB.clinica.nombre||'PowerDent'}:\n${u}\n\nCuando lo abones te damos el justificante en la clínica. ¡Gracias!`;
  const tel=telWA(p);

}


/* ══════════ 10H. FACTURACIÓN PROPIA ══════════ */
const numFactura=()=>{
  const y=new Date().getFullYear(), serie=DB.clinica.serie||'F';
  const n=(DB.facturas||[]).filter(f=>f.anio===y).length+1;
  return {num:`${serie}${y}/${String(n).padStart(4,'0')}`,anio:y};
};
function emitirFactura(datos){
  const {num,anio}=numFactura();
  const f={id:uid(),num,anio,fecha:datos.fecha||hoy(),paciente:datos.paciente,lineas:datos.lineas||[],
    base:datos.base||0,iva:Number(DB.clinica.iva||0),exenta:!Number(DB.clinica.iva||0),
    total:datos.total||datos.base||0,cobrada:!!datos.cobrada,cobroId:datos.cobroId||'',conciliada:false,notas:datos.notas||''};
  DB.facturas=[...(DB.facturas||[]),f]; save(); return f;
}
function facturarCobro(cobroId){
  const c=DB.cobros.find(x=>x.id===cobroId);
  if((DB.facturas||[]).some(f=>f.cobroId===cobroId)) return toast('Ese cobro ya está facturado');
  const f=emitirFactura({paciente:c.paciente,fecha:c.fecha,base:Number(c.importe),total:Number(c.importe),
    lineas:[{n:c.concepto||'Tratamiento odontológico',cant:1,pvp:Number(c.importe)}],cobrada:true,cobroId:c.id});
  render(); toast('Factura '+f.num+' emitida'); imprimirFacturaPropia(f.id);
}
function facturarPresupuesto(prId){
  const pr=DB.presupuestos.find(x=>x.id===prId);
  const f=emitirFactura({paciente:pr.paciente,base:total(pr),total:total(pr),
    lineas:pr.lineas.map(l=>({n:(l.cod?l.cod+' · ':'')+l.n+(l.pieza?' (pieza '+l.pieza+')':''),cant:l.cant,pvp:l.pvp}))});
  render(); toast('Factura '+f.num+' emitida'); imprimirFacturaPropia(f.id);
}
function imprimirFacturaPropia(id){
  const f=(DB.facturas||[]).find(x=>x.id===id), p=P(f.paciente), cl=DB.clinica;
  imprimir(`<div class="doc">${cabecera()}
  <h3>Factura ${esc(f.num)}</h3>
  <p style="font-size:12px">Cliente: <b>${esc(nombreP(f.paciente))}</b>${p&&p.dni?` · ${esc(p.dni)}`:''}${p&&p.dir?`<br>${esc(p.dir)}`:''}<br>Fecha: ${fecha(f.fecha)}</p>
  <table><thead><tr><th>Concepto</th><th class="num">Ud.</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead><tbody>
  ${f.lineas.map(l=>`<tr><td>${esc(l.n)}</td><td class="num">${l.cant}</td><td class="num">${eur(l.pvp)}</td><td class="num">${eur(l.pvp*l.cant)}</td></tr>`).join('')}
  </tbody></table>
  <div class="tot">Total: ${eur(f.total)}</div>
  <p style="font-size:11px;margin-top:12px">${f.exenta?'Operación exenta de IVA por aplicación del art. 20.1.3º de la Ley 37/1992 (asistencia sanitaria).':'IVA '+f.iva+'% incluido.'}</p>
  <div class="pie">${esc(cl.nombre||'PowerDent')}${cl.nif?` · NIF ${esc(cl.nif)}`:''} · Factura ${esc(f.num)}</div></div>`);
}

  const p=P(pid);
  const lab=DB.lab.filter(l=>l.paciente===pid&&l.estado==='recibido');
  imprimir(`<div class="doc">${cabecera()}<h3>Albarán de entrega</h3>

function pegarExtracto(){
  modal(`<h2>Pegar extracto bancario</h2>
  <p class="mini">Copia las líneas desde la web del banco o desde el CSV. Acepta separadores de coma, punto y coma o tabulador; también líneas sueltas tipo <i>12/08/2026 TRANSFERENCIA ALBA H. 120,00</i>.</p>
  <textarea id="ex_txt" style="min-height:190px;font-family:'IBM Plex Mono';font-size:12.5px" placeholder="12/08/2026;PAGO TARJETA CLINICA;120,00"></textarea>
  <div class="fila" style="justify-content:flex-end;margin-top:10px"><button class="btn gh" onclick="cerrarModal()">Cancelar</button>
  <button class="btn pri" onclick="importarExtracto()">Importar</button></div>`);
}
function importarExtracto(){
  const txt=v('ex_txt')||'';
  const lineas=txt.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  let n=0;
  lineas.forEach(l=>{
    const mf=l.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    const imps=[...l.matchAll(/(-?\d{1,3}(?:[.\s]\d{3})*(?:,\d{2})|-?\d+[.,]\d{2})(?!\d)/g)].map(x=>x[1]);
    if(!mf||!imps.length) return;
    const bruto=imps[imps.length-1];
    const imp=Number(bruto.replace(/[.\s]/g,'').replace(',','.'));
    const y=mf[3].length===2?'20'+mf[3]:mf[3];
    const f=`${y}-${mf[2].padStart(2,'0')}-${mf[1].padStart(2,'0')}`;
    const concepto=l.replace(mf[0],'').replace(bruto,'').replace(/[;,\t]+/g,' ').replace(/\s{2,}/g,' ').trim().slice(0,80);
    DB.banco=[...(DB.banco||[]),{id:uid(),fecha:f,concepto:concepto||'Movimiento',importe:imp,conc:''}];
    n++;
  });
  save(); cerrarModal(); render();
  toast(n?n+' movimientos importados':'No he reconocido ninguna línea');
  if(n) setTimeout(conciliarAuto,300);
}
function conciliarAuto(){
  let n=0;
  (DB.banco||[]).filter(m=>!m.conc).forEach(m=>{
    const dias=(a,b)=>Math.abs((new Date(a)-new Date(b))/86400000);
    if(m.importe>0){
      const f=(DB.facturas||[]).find(x=>!x.conciliada&&Math.abs(Number(x.total)-m.importe)<0.02&&dias(x.fecha,m.fecha)<=7);
      if(f){ m.conc='Factura '+f.num+' · '+nombreP(f.paciente); f.conciliada=true; n++; return; }
      const c=DB.cobros.find(x=>Math.abs(Number(x.importe)-m.importe)<0.02&&dias(x.fecha,m.fecha)<=7&&!x.conciliado);
      if(c){ m.conc='Cobro de '+nombreP(c.paciente); c.conciliado=true; n++; }
    } else {
      const ped=DB.pedidos.find(x=>x.factura&&!x.factura.conciliada&&Math.abs(Number(x.factura.importe)+m.importe)<0.02&&dias(x.factura.fecha,m.fecha)<=45);
      if(ped){ m.conc='Compra a '+ped.prov+' · '+ped.factura.num; ped.factura.conciliada=true; ped.factura.pagada=true; n++; }
    }
  });
  save(); render(); toast(n?n+' movimientos conciliados':'Nada que casar automáticamente');
}
function conciliarManual(id){
  const m=(DB.banco||[]).find(x=>x.id===id);
  const opciones=[...(DB.facturas||[]).filter(f=>!f.conciliada).map(f=>['Factura '+f.num+' · '+nombreP(f.paciente)+' · '+eur(f.total),'F'+f.id]),
    ...DB.pedidos.filter(x=>x.factura&&!x.factura.conciliada).map(x=>['Compra '+x.factura.num+' · '+x.prov+' · '+eur(x.factura.importe),'P'+x.id])];
  modal(`<h2>Casar movimiento</h2><p class="mini">${fecha(m.fecha)} · ${esc(m.concepto)} · <b>${eur(m.importe)}</b></p>
  <div class="f" style="margin-top:12px"><label>Documento</label><select id="cc_d">

  <div class="fila" style="justify-content:flex-end"><button class="btn gh" onclick="cerrarModal()">Cancelar</button>
  <button class="btn pri" onclick="guardarConciliacion('${id}')">Conciliar</button></div>`);
}
function guardarConciliacion(id){
  const m=(DB.banco||[]).find(x=>x.id===id), sel=v('cc_d');
  if(sel.startsWith('F')){ const f=(DB.facturas||[]).find(x=>x.id===sel.slice(1)); f.conciliada=true; m.conc='Factura '+f.num+' · '+nombreP(f.paciente); }
  else if(sel.startsWith('P')){ const x=DB.pedidos.find(y=>y.id===sel.slice(1)); x.factura.conciliada=true; x.factura.pagada=true; m.conc='Compra '+x.factura.num+' · '+x.prov; }
  else m.conc=v('cc_t')||'Otro concepto';
  save(); cerrarModal(); render(); toast('Movimiento conciliado');
}

function ocrDocumento(){
  modal(`<h2>Leer documento con OCR</h2>
  <p class="mini">Sube la foto o el PDF de una factura, ticket o extracto. Se lee en el propio navegador; nada sale de aquí salvo la descarga del motor de OCR la primera vez.</p>
  <input type="file" id="ocr_f" accept="image/*" style="margin:12px 0" onchange="lanzarOCR(this.files[0])">
  <div id="ocr_est" class="mini"></div>
  <div id="ocr_res"></div>`);
}
async function lanzarOCR(file){
  if(!file) return;
  const est=document.getElementById('ocr_est');
  est.textContent='Cargando el motor de OCR…';
  try{
    if(!window.Tesseract){
      await new Promise((ok,err)=>{const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=err;document.head.appendChild(s);});
    }
    est.textContent='Leyendo el documento…';
    const {data}=await Tesseract.recognize(file,'spa',{logger:m=>{ if(m.status==='recognizing text') est.textContent='Leyendo… '+Math.round(m.progress*100)+'%'; }});
    const t=data.text||'';
    const imps=[...t.matchAll(/(\d{1,3}(?:[.\s]\d{3})*,\d{2})/g)].map(x=>Number(x[1].replace(/[.\s]/g,'').replace(',','.')));
    const totalDet=imps.length?Math.max(...imps):0;
    const mf=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    const nif=(t.match(/\b([A-Z]\d{8}|\d{8}[A-Z])\b/)||[])[1]||'';
    const nfac=(t.match(/(?:factura|n[ºo°]\.?)\s*[:\-]?\s*([A-Z0-9\/\-]{4,20})/i)||[])[1]||'';
    const prov=(t.split(/\n/).find(l=>l.trim().length>4)||'').trim().slice(0,40);
    est.textContent='Listo. Revisa y guarda:';
    document.getElementById('ocr_res').innerHTML=`<div class="grid g2" style="margin-top:10px">
      <div class="f"><label>Proveedor</label><input id="oc_p" value="${esc(prov)}"></div>
      <div class="f"><label>Nº de factura</label><input id="oc_n" value="${esc(nfac)}"></div>
      <div class="f"><label>Fecha</label><input type="date" id="oc_f" value="${mf?`${mf[3].length===2?'20'+mf[3]:mf[3]}-${mf[2].padStart(2,'0')}-${mf[1].padStart(2,'0')}`:hoy()}"></div>
      <div class="f"><label>Importe total</label><input type="number" step="0.01" id="oc_i" value="${totalDet}"></div>
      <div class="f"><label>NIF detectado</label><input id="oc_nif" value="${esc(nif)}"></div></div>
      <details style="margin:8px 0"><summary class="mini">Ver texto leído</summary><pre class="mini" style="white-space:pre-wrap;max-height:160px;overflow:auto">${esc(t.slice(0,1500))}</pre></details>
      <div class="fila" style="justify-content:flex-end"><button class="btn gh" onclick="cerrarModal()">Cerrar</button>
      <button class="btn pri" onclick="guardarOCR()">Guardar como factura de proveedor</button></div>`;
  }catch(e){ est.textContent='No he podido leer el documento (¿sin conexión?). Puedes meter los datos a mano en Compras.'; }
}
function guardarOCR(){
  const prov=v('oc_p')||'Proveedor', imp=Number(v('oc_i')||0);
  const ped={id:uid(),prov,fecha:v('oc_f')||hoy(),previsto:v('oc_f')||hoy(),estado:'recibido',recibido:v('oc_f')||hoy(),
    nota:'Alta por OCR',lineas:[{id:uid(),ref:'',n:'Factura '+(v('oc_n')||''),cant:1,precio:imp}],
    albaran:{num:'',fecha:v('oc_f')||hoy()},
    factura:{num:v('oc_n')||'s/n',fecha:v('oc_f')||hoy(),importe:imp,vence:masDias(30),pagada:false}};
  DB.pedidos.push(ped); save(); cerrarModal(); render(); toast('Factura de proveedor registrada');
}

const mmdd=f=>f?f.slice(5):null;
function fechasEspeciales(rango){
  const hoyD=new Date(), out=[];
  DB.pacientes.forEach(p=>{
    const chk=(md,tipo)=>{
      if(!md) return;
      const d=new Date(hoyD.getFullYear(),Number(md.slice(0,2))-1,Number(md.slice(3,5)));
      let dif=Math.round((d-new Date(hoyD.toDateString()))/86400000);
      if(dif<-2) dif+=365;
      if(dif>=-1&&dif<=rango) out.push({p,tipo,dias:dif,md});
    };
    chk(mmdd(p.nacimiento),'Cumpleaños');
    chk(santoDe(p.nombre),'Santo');
  });
  return out.sort((a,b)=>a.dias-b.dias);
}
function pacientesRevision(){
  const meses=Number(DB.clinica.mesesRevision||6);
  const lim=new Date(); lim.setMonth(lim.getMonth()-meses);
  const limF=lim.toISOString().slice(0,10);
  return DB.pacientes.map(p=>{
    const ult=DB.sesiones.filter(s=>s.paciente===p.id).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    const cita=DB.citas.some(c=>c.paciente===p.id&&c.fecha>=hoy());
    return {p,ult:ult?ult.fecha:p.alta,cita};
  }).filter(x=>!x.cita&&x.ult&&x.ult<limF).sort((a,b)=>a.ult.localeCompare(b.ult));
}

function faltan(p){
  const f=[];
  if(!p.nombre||!p.apellidos) f.push('nombre completo');
  if(!p.tel) f.push('teléfono');
  if(!p.dni) f.push('DNI');
  if(!p.nacimiento) f.push('fecha de nacimiento');
  if(!p.email) f.push('email');
  if(!p.dir) f.push('dirección');
  if(!p.consent||!p.consent.firma) f.push('firma del consentimiento');
  if(p.alergias===undefined||p.alergias==='') f.push('alergias (aunque sea “ninguna”)');
  return f;
}
function abanico(pid,mini){
  const p=P(pid); if(!p) return '';
  const f=faltan(p); if(!f.length) return '';
  const urgente=f.includes('firma del consentimiento')||f.includes('teléfono');
  return `<span class="abanico ${urgente?'urge':''} ${mini?'mini':''}" title="Faltan datos: ${esc(f.join(', '))}"
    onclick="event.stopPropagation();arreglarDatos('${pid}')"><span class="hoja">${SVG_ABANICO}</span><i>${f.length}</i></span>`;
}

function horarioHoy(d){ const h=(DB.clinica.horario||{})[d]; return h&&h[0]&&h[1]?h:null; }
function estadoClinica(){
  const n=new Date(), min=n.getHours()*60+n.getMinutes(), h=horarioHoy(n.getDay());
  if(!h) return {abierto:false,motivo:tt('Hoy cerrado')};
  const a=Number(h[0].slice(0,2))*60+Number(h[0].slice(3,5)), c=Number(h[1].slice(0,2))*60+Number(h[1].slice(3,5));
  if(min<a) return {abierto:false,motivo:tt('Abre a las')+' '+h[0]};
  if(min>=c) return {abierto:false,motivo:tt('Cerró a las')+' '+h[1]};
  return {abierto:true,motivo:tt('Abierto hasta las')+' '+h[1],cierre:c-min};
}

function apilarDia(docId){
  const f=hoy(), r=resumenDia(f);
  let mover=docId?r.cit.filter(c=>c.dentista===docId):r.tar.slice();
  mover.sort((a,b)=>a.hora.localeCompare(b.hora));
  const otros=r.docs.filter(d=>d.id!==docId);
  const planes=[];
  mover.forEach(c=>{
    const cand=otros.length?otros:r.docs;
    let puesto=null;
    for(const d of cand){
      const libres=huecos(f,d.id).filter(x=>x>new Date().toTimeString().slice(0,5)&&(docId?true:x<'14:00'));
      const sitio=libres.find(x=>!planes.some(p=>p.hora===x&&p.den===d.id));
      if(sitio){ puesto={hora:sitio,den:d.id,denN:d.n}; break; }
    }
    if(puesto) planes.push({c,hora:puesto.hora,den:puesto.den,denN:puesto.denN});
  });
  if(!planes.length) return toast('No hay huecos libres para recolocar');
  modal(`<h2>${docId?'Liberar a '+esc((DB.dentistas.find(d=>d.id===docId)||{}).n||''):'Apilar el día hacia la mañana'}</h2>
  <p class="mini">${planes.length} de ${mover.length} citas se pueden recolocar. Revisa y confirma: después avisamos a cada paciente por WhatsApp.</p>
  <table style="margin-top:10px"><tbody>${planes.map(x=>{const p=P(x.c.paciente);
    return `<tr><td><b>${esc(p?nombreP(x.c.paciente):'Paciente')}</b><div class="mini">${esc(x.c.motivo||'')}</div></td>
    <td class="mono mini">${x.c.hora} →</td><td class="mono"><b>${x.hora}</b><div class="mini">${esc(x.denN)}</div></td></tr>`;}).join('')}
  </tbody></table>
  ${planes.length<mover.length?`<p class="mini" style="color:var(--marca)">${mover.length-planes.length} cita(s) sin hueco: quedan como estaban.</p>`:''}
  <div class="fila" style="justify-content:flex-end;margin-top:12px"><button class="btn gh" onclick="cerrarModal()">Cancelar</button>
  <button class="btn pri" onclick='aplicarApilado(${JSON.stringify(planes.map(x=>({id:x.c.id,hora:x.hora,den:x.den})))})'>Confirmar y avisar</button></div>`);
}
function aplicarApilado(planes){
  const cambios=[];
  planes.forEach(pl=>{
    const c=DB.citas.find(x=>x.id===pl.id); if(!c) return;
    const antes={fecha:c.fecha,hora:c.hora};
    c.hora=pl.hora; c.dentista=pl.den; c.waEnviado=null;
    const g=DB.gabinetes.find(x=>!DB.citas.some(o=>o.id!==c.id&&o.fecha===c.fecha&&o.gabinete===x.id&&o.hora===c.hora));
    if(g) c.gabinete=g.id;
    cambios.push({c,antes});
  });
  save(); cerrarModal(); render();
  toast(cambios.length+' citas recolocadas');
  cambios.forEach((x,i)=>setTimeout(()=>avisoCambio(x.c,null,null,x.antes),i*900));
}
