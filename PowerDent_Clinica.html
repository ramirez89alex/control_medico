/* ══════════ 13. ASISTENTE DE VOZ ══════════ */
const VOZ={activo:false,rec:null,siempre:false,ultimo:'',hablar:true};
const sinAcento=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const UNI={cero:0,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28};
const DEC={treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90};
const CEN={cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};
function menor100(txt){
  const m=txt.match(/(treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa)(?:\s*y\s*([a-z]+))?/);
  if(m) return DEC[m[1]]+(m[2]&&UNI[m[2]]!==undefined?UNI[m[2]]:0);
  const u=txt.match(/\b(veintiuno|veintidos|veintitres|veinticuatro|veinticinco|veintiseis|veintisiete|veintiocho|veintinueve|veinte|diecinueve|dieciocho|diecisiete|dieciseis|quince|catorce|trece|doce|once|diez|nueve|ocho|siete|seis|cinco|cuatro|tres|dos|uno|una)\b/);
  return u?UNI[u[1]]??null:null;
}
function numES(txt){
  txt=sinAcento(txt).trim().replace(/[.,](?=\d{3}\b)/g,'');
  const d=txt.match(/\d+([.,]\d{1,2})?/); if(d) return Number(d[0].replace(',','.'));
  let n=0, resto=txt;
  const mil=txt.match(/(.*)\bmil\b(.*)/);
  if(mil){ n+=(menor100(mil[1])||(/\w/.test(mil[1].trim())?1:1))*1000; resto=mil[2]; }
  const c=resto.match(/\b(cien|ciento|doscientos|trescientos|cuatrocientos|quinientos|seiscientos|setecientos|ochocientos|novecientos)\b/);
  if(c){ n+=CEN[c[1]]; resto=resto.slice(resto.indexOf(c[1])+c[1].length); }
  const u=menor100(resto);
  if(u!==null) n+=u;
  return n||null;
}

function procesarVoz(frase){

function ejecutarVoz(t,original){
  let p=pacienteAbierto?P(pacienteAbierto):null;
  const sil=enSilla();
  if(!p&&sil) p=P(sil.paciente);
  let m;

  if(/^(ayuda|que puedes hacer|comandos)/.test(t)) return ayudaVoz();
  if(/^(cierra|cerrar|volver|atras)/.test(t)){ cerrarModal(); pacienteAbierto=null; render(); return resp('Cerrado'); }
  if(/^(agenda|abre la agenda|planning)/.test(t)){ ruta='agenda'; portalId=null; pacienteAbierto=null; pintarNav(); render(); return resp('Agenda del día'); }
  if(/(dictado|escucha siempre) (on|activado|activa)/.test(t)){ VOZ.siempre=true; return resp('Escucho todo, sin palabra clave'); }
  if(/(dictado|escucha siempre) (off|desactivado|desactiva)/.test(t)){ VOZ.siempre=false; return resp('Vuelvo a esperar la palabra clave'); }

  // check-in: ha llegado / pasa a la silla
  m=t.match(/(?:ha\s+)?llego\s+(.+)|llegada de\s+(.+)/);
  if(m){
    const q=(m[1]||m[2]).trim(), c=buscarCitaHoy(q);
    if(!c) return resp('No encuentro cita de hoy para '+q);
    marcarEstado(c.id,'llegado'); return resp(nombreP(c.paciente)+' en sala de espera');
  }
  m=t.match(/(?:sienta|sentar|pasa|entra|esta en la silla|al sillon)\s*(?:a|al|la)?\s*(.*)/);
  if(m&&/(sienta|sentar|pasa|entra|silla|sillon)/.test(t)){
    const q=m[1].trim();
    const c=q?buscarCitaHoy(q):citasHoy().find(x=>x.estado==='llegado');
    if(!c) return resp(q?'No encuentro cita de hoy para '+q:'Nadie marcado como llegado');
    sentar(c.id); return resp(nombreP(c.paciente)+' en el sillón. Dime qué le haces');
  }
  if(/^(termina|terminar|finaliza|cerrar visita|hemos terminado)/.test(t)&&sil){
    terminarSillon(sil.id); return resp('Visita cerrada. Ponemos la próxima cita');
  }

  m=t.match(/(?:abre|abrir|busca|buscar|saca|muestra)\s*(?:la|el)?\s*(?:carpeta|ficha|historia|paciente)?\s*(?:de|del|de la)?\s*(.+)/);
  if(m&&/(carpeta|ficha|historia|paciente|abre|abrir|busca)/.test(t)){
    const q=m[1].replace(/\b(por apellido|apellido)\b/g,'').trim();
    const res=DB.pacientes.filter(x=>sinAcento(`${x.nombre} ${x.apellidos}`).includes(sinAcento(q))||sinAcento(q).includes(sinAcento(x.apellidos||'zzz')));
    if(res.length===1){ abrir(res[0].id); return resp('Abro la carpeta de '+nombreP(res[0].id)); }
    if(res.length>1){ ruta='pacientes'; window._q=q; pacienteAbierto=null; pintarNav(); render(); return resp('Hay '+res.length+' pacientes con ese apellido, elige en pantalla'); }
    return resp('No encuentro a '+q);
  }
  if(/nuev[oa] paciente/.test(t)){
    const nom=original.replace(/.*nuev[oa] paciente/i,'').trim();
    const [n,...a]=nom.split(' '); const id=crearPaciente(n||'',a.join(' ')); abrir(id);
    return resp('Ficha creada. Recuerda la firma de protección de datos');
  }
  if(!p&&/(apunta|anota|presupuesto|factura|cobra|proxima|cita)/.test(t)) return resp('Primero abre la carpeta de un paciente o siéntalo en el sillón');

  // próxima cita con fecha dictada → asigna y prepara WhatsApp
  if(/(proxima|siguiente|dale|ponle|agenda|citar)\s*(cita|visita|hora)?/.test(t)&&/(cita|visita|hora|dia)/.test(t)){
    const {fecha:f,hora}=fechaES(original);
    const limpio=original.replace(/.*?(?:pr[oó]xima|siguiente|agenda|ponle|dale|citar)\s*(?:cita|visita|hora)?\s*/i,'')
      .replace(/(?:el\s+)?[\wáéíóú]+\s+de\s+(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)/gi,'')
      .replace(/(?:en|dentro de)\s+[\wáéíóú\s]{1,18}?\s*(?:d[ií]as?|semanas?|meses?)/gi,'')
      .replace(/a\s+las?\s+[\wáéíóú]+(?:\s*[:.]\s*\d{2})?(?:\s*y\s*(?:media|cuarto)|\s*menos\s*cuarto)?(?:\s+de\s+la\s+(?:ma[ñn]ana|tarde|noche))?/gi,'')
      .replace(/\b(?:ma[ñn]ana|pasado ma[ñn]ana|lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bado|domingo|que viene|pr[óo]ximo|siguiente)\b/gi,'')
      .replace(/\s{2,}/g,' ').trim().replace(/^(?:para|por|y|de|a|que|,|\.)\s+/i,'').trim();
    if(!f) { citaRapida(p.id,{revisar:limpio,hora}); return resp('No he pillado la fecha, te la dejo abierta en pantalla'); }
    const c=crearCita(p.id,f,hora||'10:00',30,limpio||(p.proxima?.nota||'Control'));
    ruta=ruta==='sillon'?'sillon':ruta; render();
    const d=new Date(f+'T00:00:00').toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'});
    setTimeout(()=>enviarWA(c.id),400);
    return resp('Cita el '+d+' a las '+(hora||'10:00')+'. Reviso: '+(limpio||'control')+'. Abriendo WhatsApp');
  }
  // próxima visita sin fecha (queda pendiente de citar)
  m=t.match(/(?:proxima|siguiente)\s*(?:visita)[,:]?\s*(.+)/);
  if(m){
    const nota=original.replace(/.*?(?:pr[oó]xima|siguiente)\s*(?:visita)[,:]?\s*/i,'').trim();
    const pl=nota.match(/en\s+\d+\s+(?:d[ií]as?|semanas?|meses?)/i);
    p.proxima={nota:nota.replace(/,?\s*en\s+\d+\s+(?:d[ií]as?|semanas?|meses?)/i,'').trim(),plazo:pl?pl[0]:'',citada:false,fechaNota:hoy()};
    save(); render(); return resp('Anotado para la próxima visita: '+p.proxima.nota);
  }
  if(/(manda|envia|enviar)\s*(el\s*)?(whatsapp|mensaje|recordatorio)/.test(t)){
    const sig=DB.citas.filter(x=>x.paciente===p.id&&x.fecha>=hoy()).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];
    if(!sig) return resp('No tiene ninguna cita futura');
    enviarWA(sig.id); return resp('Enviando el recordatorio por WhatsApp');
  }
  // sesión / lo realizado
  m=t.match(/^(?:apunta|anota|registra|he hecho|hemos hecho|realizado|estoy haciendo|le hice)\s*[:,]?\s*(.+)/);
  if(m){
    const txt=original.replace(/^.*?(?:apunta|anota|registra|he hecho|hemos hecho|realizado|estoy haciendo|le hice)\s*[:,]?\s*/i,'').trim();
    const pieza=piezaEn(txt);
    DB.sesiones.push({id:uid(),paciente:p.id,fecha:hoy(),hora:new Date().toTimeString().slice(0,5),
      acto:txt,piezas:pieza,nota:'Dictado por voz: '+txt,audio:'',audioNo:false});
    save(); render(); return resp('Registrado'+(pieza?', pieza '+pieza:''));
  }
  // presupuesto / factura por dictado
  if(/(presupuesto|presupuesta|factura|facturar)/.test(t)){
    const porCod=porCodigo(original); const tr=porCod?[porCod]:tratamientosEn(original); const pieza=piezaEn(original);
    if(!tr.length) return resp('No he reconocido tratamientos. Di el nombre o el código, por ejemplo: presupuesto código diez punto cero uno');
    const pr={id:uid(),paciente:p.id,fecha:hoy(),validez:30,dto:0,estado:/factura/.test(t)?'aceptado':'enviado',
      lineas:tr.map(x=>({id:uid(),cod:x.cod,n:x.n,pieza:tr.indexOf(x)===0?pieza:'',cant:1,pvp:x.pvp,coste:x.coste})),
      notas:'Dictado: '+original};
    DB.presupuestos.push(pr); save();
    if(/factura/.test(t)){
      DB.cobros.push({id:uid(),paciente:p.id,fecha:hoy(),importe:total(pr),forma:'Tarjeta',
        concepto:tr.map(x=>x.n).join(' + '),num:DB.cobros.length+1});
      save(); render(); imprimirFactura(DB.cobros[DB.cobros.length-1].id);
      return resp('Factura de '+Math.round(total(pr))+' euros generada');
    }
    render(); imprimirPresu(pr.id);
    return resp('Presupuesto de '+Math.round(total(pr))+' euros: '+tr.map(x=>x.n).join(', '));
  }
  // cobro
  m=t.match(/cobra(?:r)?\s+(.+?)\s*(?:euros?|€)/);
  if(m){
    const imp=numES(m[1]);
    if(!imp) return resp('No he entendido el importe');
    const forma=/efectivo/.test(t)?'Efectivo':/transferencia/.test(t)?'Transferencia':/financia/.test(t)?'Financiación':'Tarjeta';
    DB.cobros.push({id:uid(),paciente:p.id,fecha:hoy(),importe:imp,forma,concepto:'Cobro dictado por voz',num:DB.cobros.length+1});
    save(); render(); return resp('Cobrados '+imp+' euros en '+forma);
  }
  if(/imprim/.test(t)){
    if(/consentimiento|proteccion/.test(t)&&p) { imprimirConsent(p.id); return resp('Imprimiendo consentimiento'); }
    if(/ficha|historia/.test(t)&&p) { imprimirFicha(p.id); return resp('Imprimiendo historia clínica'); }
    const ult=DB.presupuestos.filter(x=>!p||x.paciente===p.id).slice(-1)[0];
    if(ult){ imprimirPresu(ult.id); return resp('Imprimiendo el último presupuesto'); }
  }
  if(/portal/.test(t)&&p){ portalPaciente(p.id); return resp('Portal de '+nombreP(p.id)); }
  if(DB.clinica.iaKey){ pintarVoz('Consultando…'); iaComando(original).then(ok=>{ if(!ok) resp('No he entendido. Di “Power, ayuda” para ver los comandos'); }); return; }
  return resp('No he entendido. Di “Power, ayuda” para ver los comandos');
}
function buscarCitaHoy(q){
  const s=sinAcento(q);
  return citasHoy().find(c=>{const p=P(c.paciente);
    const nom=sinAcento(p?`${p.nombre} ${p.apellidos}`:(c.nombreLibre||''));
    return nom&&(nom.includes(s)||s.includes(sinAcento(p?.apellidos||'zzzz')));});
}

/* ---- intérprete con IA (opcional) ---- */
async function iaComando(frase){
  const cl=DB.clinica;
  if(!cl.iaKey) return false;
  const p=pacienteAbierto?P(pacienteAbierto):(enSilla()?P(enSilla().paciente):null);
  const sistema=`Eres el intérprete de órdenes de una clínica dental. Devuelve SOLO un JSON, sin texto alrededor, con esta forma:
{"accion":"apuntar|cita|cobro|presupuesto|abrir|proxima|nada","texto":"","fecha":"AAAA-MM-DD","hora":"HH:MM","importe":0,"tratamientos":["..."],"pieza":""}
Hoy es ${hoy()}. Si la orden no encaja en ninguna acción, usa "nada". No inventes datos que no estén en la frase.`;
  try{
    const r=await fetch((cl.iaUrl||'https://api.openai.com/v1/chat/completions'),{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cl.iaKey},
      body:JSON.stringify({model:cl.iaModelo||'gpt-4o-mini',temperature:0,
        messages:[{role:'system',content:sistema},{role:'user',content:frase}]})});
    const j=await r.json();
    const txt=(j.choices?.[0]?.message?.content||'').replace(/```json|```/g,'').trim();
    const o=JSON.parse(txt);
    return aplicarIA(o,frase,p);
  }catch(e){ return false; }
}
function aplicarIA(o,frase,p){
  if(!o||o.accion==='nada') return false;
  if(o.accion==='abrir'){
    const res=DB.pacientes.filter(x=>sinAcento(`${x.nombre} ${x.apellidos}`).includes(sinAcento(o.texto||'')));
    if(res.length===1){ abrir(res[0].id); resp('Abro la carpeta de '+nombreP(res[0].id)); return true; }
    return false;
  }
  if(!p) return false;
  if(o.accion==='apuntar'){
    DB.sesiones.push({id:uid(),paciente:p.id,fecha:hoy(),hora:new Date().toTimeString().slice(0,5),
      acto:o.texto||frase,piezas:o.pieza||piezaEn(frase),nota:'Dictado: '+frase,audio:''});
    save(); render(); resp('Registrado'); return true;
  }
  if(o.accion==='cita'&&o.fecha){
    const c=crearCita(p.id,o.fecha,o.hora||'10:00',30,o.texto||'Control');
    render(); setTimeout(()=>enviarWA(c.id),400);
    resp('Cita el '+fecha(o.fecha)+' a las '+(o.hora||'10:00')); return true;
  }
  if(o.accion==='proxima'){
    p.proxima={nota:o.texto||frase,plazo:'',citada:false,fechaNota:hoy()}; save(); render();
    resp('Anotado para la próxima visita'); return true;
  }
  if(o.accion==='cobro'&&o.importe){
    DB.cobros.push({id:uid(),paciente:p.id,fecha:hoy(),importe:Number(o.importe),forma:'Tarjeta',concepto:o.texto||'Cobro',num:DB.cobros.length+1});
    save(); render(); resp('Cobrados '+o.importe+' euros'); return true;
  }
  if(o.accion==='presupuesto'&&(o.tratamientos||[]).length){
    const lin=o.tratamientos.map(n=>{
      const t=DB.tarifario.find(x=>sinAcento(x.n).includes(sinAcento(n)))||tratamientosEn(n)[0];
      return t?{id:uid(),cod:t.cod,n:t.n,pieza:'',cant:1,pvp:t.pvp,coste:t.coste}:null;}).filter(Boolean);
    if(!lin.length) return false;
    if(o.pieza) lin[0].pieza=o.pieza;
    const pr={id:uid(),paciente:p.id,fecha:hoy(),validez:30,dto:0,estado:'enviado',lineas:lin,notas:'Dictado: '+frase};
    DB.presupuestos.push(pr); save(); render(); imprimirPresu(pr.id);
    resp('Presupuesto de '+Math.round(total(pr))+' euros'); return true;
  }
  return false;
}

function trad(txt){
  if((DB.clinica.idioma||'es')!=='en') return txt;
  let t=txt;
  EN_DOC.slice().sort((a,b)=>b[0].length-a[0].length).forEach(([es,en])=>{ t=t.split(es).join(en); });
  return t;
}

function traducirDOM(){
  if((DB.clinica.idioma||'es')!=='en') return;
  const walk=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null);
  const nodos=[]; while(walk.nextNode()) nodos.push(walk.currentNode);
  nodos.forEach(n=>{
    const orig=n.nodeValue, t=orig.trim(); if(!t) return;
    let d=null;
    if(EN[t]) d=EN[t];
    else{
      const sinP=t.replace(/[.:·]+$/,'');
      if(EN[sinP]) d=t.replace(sinP,EN[sinP]);
      else if(/[·|,]/.test(t)&&t.length<200){
        const partes=t.split(/(\s*[·|]\s*)/); let cambio=false;
        const nuevo=partes.map(x=>{const k=x.trim(); if(EN[k]){cambio=true;return x.replace(k,EN[k]);} return x;}).join('');
        if(cambio) d=nuevo;
      }
    }
    if(d===null) d=trad(t);
    PATRONES.forEach(([re,rep])=>{ d=d.replace(re,rep); });
    if(d!==t) n.nodeValue=orig.replace(t,d);
  });

  document.querySelectorAll('[placeholder]').forEach(e=>{ if(EN[e.placeholder]) e.placeholder=EN[e.placeholder]; });
  document.querySelectorAll('[title]').forEach(e=>{ if(EN[e.title]) e.title=EN[e.title]; });
  document.querySelectorAll('[data-l]').forEach(e=>{ if(EN[e.dataset.l]) e.dataset.l=EN[e.dataset.l]; });
}
async function cambiarIdioma(l){
  DB.clinica.idioma=l;
  clearTimeout(guardando);
  await Store.set(KEY,JSON.stringify(DB));
  document.getElementById('html').lang=l;
  pintarNav(); render();
  toast(l==='en'?'English':'Español');
}
function selectorIdioma(){
  const l=DB.clinica?.idioma||'es';
  return `<div class="idioma"><button class="${l==='es'?'on':''}" onclick="cambiarIdioma('es')">ES</button><button class="${l==='en'?'on':''}" onclick="cambiarIdioma('en')">EN</button></div>`;
}

/* ══════════ 16. UTILIDADES UI ══════════ */
const v=id=>{const e=document.getElementById(id);return e?e.value:'';};
function modal(html){
  const d=document.createElement('div'); d.className='overlay'; d.id='ov';
  d.innerHTML=`<div class="modal">${html}</div>`;
  setTimeout(traducirDOM,0);
  d.onclick=e=>{if(e.target===d)cerrarModal();};
  document.body.appendChild(d);
}
function cerrarModal(){const o=document.getElementById('ov');if(o)o.remove();}
addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal();});
